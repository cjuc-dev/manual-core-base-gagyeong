<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 아이콘 분리 도구</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-area.dragover {
            background: #e8e9ff;
            border-color: #764ba2;
        }
        
        input[type="file"] {
            display: none;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
            display: block;
            margin: 20px auto;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #preview {
            text-align: center;
            margin: 30px 0;
        }
        
        #preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .icon-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .icon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .icon-card img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .icon-card h3 {
            color: #667eea;
            margin: 10px 0;
        }
        
        .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.2s;
        }
        
        .download-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        
        .status {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 이미지 아이콘 분리 도구</h1>
        
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <h2>📁 이미지를 드래그 & 드롭하거나 클릭하여 선택하세요</h2>
            <p>PNG, JPG, JPEG 형식 지원</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div id="preview"></div>
        
        <button id="splitBtn" onclick="splitImage()" disabled>✂️ 이미지 분리하기</button>
        
        <div id="status"></div>
        <div id="results" class="results"></div>
    </div>

    <script>
        let uploadedImage = null;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const splitBtn = document.getElementById('splitBtn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        // 드래그 앤 드롭 이벤트
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    preview.innerHTML = `<h3>업로드된 이미지</h3><img src="${e.target.result}" alt="Uploaded Image">`;
                    splitBtn.disabled = false;
                    status.innerHTML = '<div class="status info">✅ 이미지가 로드되었습니다. "이미지 분리하기" 버튼을 클릭하세요.</div>';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function splitImage() {
            if (!uploadedImage) return;

            const width = uploadedImage.width;
            const height = uploadedImage.height;
            const iconWidth = Math.floor(width / 3);

            results.innerHTML = '';
            status.innerHTML = '<div class="status info">⏳ 이미지를 분리하는 중...</div>';

            const icons = [
                { name: 'elevator_icon.png', title: '엘리베이터 아이콘', x: 0 },
                { name: 'fire_hose_icon.png', title: '소화전 아이콘', x: iconWidth },
                { name: 'fire_extinguisher_icon.png', title: '소화기 아이콘', x: iconWidth * 2 }
            ];

            icons.forEach(icon => {
                const canvas = document.createElement('canvas');
                canvas.width = iconWidth;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                
                ctx.drawImage(uploadedImage, icon.x, 0, iconWidth, height, 0, 0, iconWidth, height);
                
                const iconCard = document.createElement('div');
                iconCard.className = 'icon-card';
                
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                
                const title = document.createElement('h3');
                title.textContent = icon.title;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = '💾 다운로드';
                downloadBtn.onclick = () => downloadIcon(canvas, icon.name);
                
                iconCard.appendChild(img);
                iconCard.appendChild(title);
                iconCard.appendChild(downloadBtn);
                results.appendChild(iconCard);
            });

            status.innerHTML = '<div class="status success">✅ 이미지 분리 완료! 각 아이콘을 다운로드하세요.</div>';
        }

        function downloadIcon(canvas, filename) {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }
    </script>
</body>
</html>
