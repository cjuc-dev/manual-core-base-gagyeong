<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<title>서브메뉴 테스트</title>
		<style>
			.sidebar {
				width: 250px;
				height: 100vh;
				background-color: #2c3e50;
				color: white;
				padding: 20px;
				box-sizing: border-box;
				overflow-y: auto;
			}
			.sidebar ul {
				list-style: none;
				padding: 0;
				margin: 0;
			}
			.sidebar li {
				margin-bottom: 10px;
				cursor: pointer;
			}
			.sidebar a {
				color: white;
				text-decoration: none;
				padding: 10px;
				display: block;
				background: #3b4f65;
				border-radius: 5px;
			}
			.sidebar a:hover {
				background-color: #1abc9c;
			}
			.submenu,
			.submenu2 {
				display: none;
				padding-left: 15px;
				border-left: 3px solid rgba(255, 255, 255, 0.3);
				margin-left: 10px;
			}
			.submenu.show,
			.submenu2.show {
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="sidebar">
			<ul>
				<li>
					<a href="#" onclick="toggleMenu('manual')">매뉴얼</a>
					<ul id="manual" class="submenu">
						<li><a href="#">행정</a></li>
						<li><a href="#">기술</a></li>
						<li>
							<a href="#" onclick="toggleMenu('phy'); event.stopPropagation();">체육</a>
							<ul id="phy" class="submenu2">
								<li><a href="#">체육시설 안전관리 매뉴얼</a></li>
								<li><a href="#">심폐소생술</a></li>
							</ul>
						</li>
					</ul>
				</li>
				<li><a href="#">VOC</a></li>
			</ul>
		</div>

		<script>
			function toggleMenu(menuId) {
				const targetMenu = document.getElementById(menuId);
				const isSubmenu2 = targetMenu.classList.contains('submenu2');

				if (isSubmenu2) {
					document.querySelectorAll('.submenu2').forEach((menu) => {
						if (menu !== targetMenu) menu.classList.remove('show');
					});
					targetMenu.classList.toggle('show');
					return;
				}

				document.querySelectorAll('.submenu').forEach((menu) => {
					if (menu !== targetMenu) menu.classList.remove('show');
				});
				targetMenu.classList.toggle('show');

				// 하위 submenu2 닫기
				if (!targetMenu.classList.contains('show')) {
					targetMenu.querySelectorAll('.submenu2').forEach((sub) => sub.classList.remove('show'));
				}
			}
		</script>
	</body>
</html>
