<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>체육시설 통합 매뉴얼 - 모바일</title>

		<!-- 공지 팝업 / 기존 스타일 -->
		<script src="https://manual-5d03dc.gitlab.io/javaScript/noticePopup.js"></script>
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/styles_main.css" />
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/sidebar_styles.css" />
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/sidebar_submenu2.css" />
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/tooltip_styles.css" />
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/main_link_styles.css" />
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/table_styles.css" />
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/mobile_override.css" />
		<!-- mobile_override test용 -->

		<!-- Tailwind -->
		<script src="https://cdn.tailwindcss.com"></script>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
			}

			body {
				font-family: Arial, sans-serif;
				background-color: #e5e7eb;
				/* 🔧 전체 페이지 스크롤 허용 (하단 탭이 브라우저 툴바에 가려져도 내려서 볼 수 있게) */
				overflow-y: auto;
			}

			.app-wrapper {
				max-width: 480px;
				width: 100%;
				margin: 0 auto;
				/* 🔧 고정 height 대신 min-height 사용 (콘텐츠 길이에 따라 자연스럽게 늘어나도록) */
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				background-color: #ffffff;
			}

			/* 각 탭 화면을 동일 폭으로 맞추는 공통 래퍼 */
			.full-page {
				width: 100%;
				max-width: 480px;
				margin: 0 auto;
				padding: 16px;
				box-sizing: border-box;
			}

			.no-scrollbar::-webkit-scrollbar {
				display: none;
			}
			.no-scrollbar {
				-ms-overflow-style: none;
				scrollbar-width: none;
			}

			.fade-in {
				animation: fadeIn 0.25s ease-in-out;
			}
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(4px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* PC용 링크 스타일 재사용 */
			a.menu-link,
			a.menu-link:visited,
			a.menu-link:hover {
				color: #070707 !important;
				text-decoration: none !important;
				font-weight: bold;
			}
			.menu-link:hover {
				color: #0056b3;
			}
			.highlight {
				color: #007bff !important;
				font-weight: bold;
			}
			.info-icon {
				width: 20px;
				height: 20px;
				margin-left: 10px;
				margin-right: 5px;
				background-color: transparent;
			}
			.hover-icon {
				width: 20px;
				height: 20px;
				margin-left: 10px;
				display: none;
				background-color: transparent;
			}
			.menu-link:hover + .hover-icon {
				display: inline;
			}

			/* 🔧 메인 뷰포트: 아래에 여유 공간을 줘서 하단 탭/브라우저 툴바에 내용이 가려지지 않도록 */
			#content-viewport {
				width: 100%;
				max-width: 100%;
				padding-bottom: 5rem; /* 하단 탭 높이 + 브라우저 하단바 고려 여유 */
				box-sizing: border-box;
			}
			/* 📌 PC용 HTML을 모바일에서 보기 좋게 감싸는 래퍼 */
			.pc-html-wrapper table {
				width: 100% !important;
				border-collapse: collapse !important;
				table-layout: fixed; /* 칸 넓이 균등 배분 */
			}

			/* 표 셀 여백/글자 크기 축소 */
			.pc-html-wrapper th,
			.pc-html-wrapper td {
				padding: 4px !important;
				font-size: 11px !important;
			}

			/* 표 안 이미지 전체 폭 대응 */
			.pc-html-wrapper img {
				max-width: 100%;
				height: auto;
			}

			/* 청주수영장 시설 사진 영역 – 좌우 여백 최소화 */
			.pc-html-wrapper .image-container {
				width: 100% !important;
				display: flex;
				flex-wrap: wrap;
				justify-content: space-between !important; /* 가운데 정렬 → 양 끝까지 */
				gap: 4px !important;
				box-sizing: border-box;
			}

			/* 사진 5장을 한 줄에 최대한 채워서 배치 */
			.pc-html-wrapper .image-container img {
				flex: 1 1 19%; /* 한 줄에 5개 기준 */
				margin: 0 !important; /* 인라인 margin 제거 */
			}
		</style>
	</head>
	<body>
		<div class="app-wrapper shadow-lg">
			<!-- 헤더 -->
			<header class="bg-white border-b border-gray-100 px-4 py-3 flex justify-between items-center">
				<!-- 왼쪽: 홈 아이콘 (홈 화면 이동) -->
				<button class="text-gray-500" aria-label="홈" onclick="goHome()">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11
                         l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1
                         h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
					</svg>
				</button>

				<h1 id="header-title" class="text-lg font-bold text-gray-800">체육시설 통합 매뉴얼</h1>

				<!-- 오른쪽: 뒤로가기 아이콘 (한 페이지 뒤로) -->
				<button class="text-gray-500" aria-label="뒤로가기" onclick="goBack()">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M15 19l-7-7 7-7"></path>
					</svg>
				</button>
			</header>

			<!-- 메인 (이제 여기서는 별도 스크롤 제거 → 페이지 전체 스크롤) -->
			<main id="content-viewport" class="flex-1 bg-gray-50"></main>

			<!-- 하단 탭바 -->
			<nav class="bg-white border-t border-gray-200 h-16 flex justify-around items-center pb-1">
				<button
					data-tab="home"
					class="tab-btn flex flex-col items-center text-blue-600"
					onclick="switchTab('home')">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11
                         l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1
                         h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
					</svg>
					<span class="text-[10px] font-medium mt-1">홈</span>
				</button>

				<button
					data-tab="status"
					class="tab-btn flex flex-col items-center text-gray-400"
					onclick="switchTab('status')">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7
                         a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0
                         012-2h2a2 2 0 012 2"></path>
					</svg>
					<span class="text-[10px] font-medium mt-1">시설현황</span>
				</button>

				<button
					data-tab="manual"
					class="tab-btn flex flex-col items-center text-gray-400"
					onclick="switchTab('manual')">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168
                         5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477
                         4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0
                         3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5
                         18c-1.746 0-3.332.477-4.5 1.253"></path>
					</svg>
					<span class="text-[10px] font-medium mt-1">안전관리 매뉴얼</span>
				</button>

				<button
					data-tab="help"
					class="tab-btn flex flex-col items-center text-gray-400"
					onclick="switchTab('help')">
					<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172
                         9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0
                         11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path>
					</svg>
					<span class="text-[10px] font-medium mt-1">Help</span>
				</button>
			</nav>
		</div>

		<script>
			const viewport = document.getElementById('content-viewport');
			const headerTitle = document.getElementById('header-title');

			/* 콘텐츠 경로 */
			const contentPathsMobile = {
				update: 'updatecontainer/updatecontainer_main.html',
				facility: 'facility_status/facility_status.html',
				cheongjuSwimming_guide: 'guide/cheongju_swimming_pool_guide.html',
				purmi_guide: 'guide/purmi_guide.html',
				youngun_sportscenter_guide: 'guide/youngun_sportscenter_guide.html',
				bokdae_sportscenter_guide: 'guide/bokdae_sportscenter_guide.html',
				gagyeong_sportscenter_guide: 'guide/gagyeong_sportscenter_guide.html',
				gagyeong_sportscenter_manual_2_2_5: 'gagyeong_sportscenter/manual_2_2_5_main.html',
				gagyeong_admin: 'gagyeong_sportscenter/manual_2_1_5_main.html',
				voc_swimming_pool: 'voc/voc_swimming_pool.html',
				voc_multipurpose_sports_hall: 'voc/voc_multipurpose_sports_hall.html',
				voc_program_room: 'voc/voc_program_room.html',
				voc_other_information: 'voc/voc_other_information.html',
				phy_manual_1: 'phy_manual/phy_manual_1.html',
				phy_manual_2: 'phy_manual/phy_manual_2.html',
				phy_manual_3: 'phy_manual/phy_manual_3.html',
				phy_manual_4: 'phy_manual/phy_manual_4.html',
			};

			function generateContentMobile(section) {
				const contentTemplates = {
					admin: `
                <p style="display:flex;align-items:center;">
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png" class="info-icon">
                    <span class="hidden-text">2.1.1.</span>
                    <a href="#" class="menu-link" onclick="location.href='tech2.html';">
                        <span class="highlight">청주수영장 행정분야</span>를 클릭하면 해당 매뉴얼 페이지로 이동합니다. &lt;미구현&gt;
                    </a>
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon2.png" class="hover-icon">
                </p>
            `,
					tech: `
                <p style="display:flex;align-items:center;">
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png" class="info-icon">
                    <span class="hidden-text">2.2.1.</span>
                    <a href="#" class="menu-link" onclick="location.href='tech2.html';">
                        <span class="highlight">청주수영장 기술분야</span>를 클릭하면 해당 매뉴얼 페이지로 이동합니다. &lt;미구현&gt;
                    </a>
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon2.png" class="hover-icon">
                </p>
            `,
					phy: `
                <p style="display:flex;align-items:center;">
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png" class="info-icon">
                    <span class="hidden-text">2.3.1.</span>
                    <a href="#" class="menu-link" onclick="location.href='tech2.html';">
                        <span class="highlight">체육분야</span>를 클릭하면 해당 매뉴얼 페이지로 이동합니다. &lt;미구현&gt;
                    </a>
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon2.png" class="hover-icon">
                </p>
            `,
					helpdesk: `
                <p style="display:flex;align-items:center;">
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png" class="info-icon">
                    <span class="hidden-text">2.4.1.</span>
                    <a href="#"
                       class="menu-link"
                       onclick="location.href='https://docs.google.com/spreadsheets/d/1gkFP9ARlFcD6uUwKhKYZTIWMENFj7Hs1k6FgW8fN1uA/edit?usp=sharing';">
                        <span class="highlight">Help</span>를 클릭하면 수정·개선 요청사항을 작성할 수 있습니다.
                    </a>
                    <img src="https://manual-5d03dc.gitlab.io/icon/link_icon2.png" class="hover-icon">
                </p>
            `,
				};
				return contentTemplates[section] || '<p>올바른 섹션이 아닙니다.</p>';
			}

			function loadContentMobile(section, titleOverride) {
				if (titleOverride) headerTitle.innerText = titleOverride;
				viewport.innerHTML =
					'<div class="full-page fade-in text-sm text-gray-500">콘텐츠를 불러오는 중입니다...</div>';

				if (contentPathsMobile[section]) {
					const url = `https://manual-5d03dc.gitlab.io/${contentPathsMobile[section]}`;
					fetch(url)
						.then((res) => {
							if (!res.ok) throw new Error('Network error');
							return res.text();
						})
						.then((html) => {
							viewport.innerHTML = `
        <div class="full-page fade-in">
            <div class="bg-white rounded-xl shadow-sm p-3 text-sm pc-html-wrapper">
                ${html}
            </div>
        </div>`;
						})
						.catch((err) => {
							console.error(err);
							viewport.innerHTML =
								'<div class="full-page fade-in text-red-500 text-sm">콘텐츠를 불러오는 데 실패했습니다.</div>';
						});
				} else {
					viewport.innerHTML = `
            <div class="full-page fade-in bg-white rounded-xl shadow-sm p-3 text-sm">
                ${generateContentMobile(section)}
            </div>`;
				}
			}

			/* 탭 전환 */
			function switchTab(tab) {
				document.querySelectorAll('.tab-btn').forEach((btn) => {
					if (btn.dataset.tab === tab) {
						btn.classList.remove('text-gray-400');
						btn.classList.add('text-blue-600');
					} else {
						btn.classList.add('text-gray-400');
						btn.classList.remove('text-blue-600');
					}
				});

				if (tab === 'home') {
					headerTitle.innerText = '체육시설 통합 매뉴얼';
					renderDashboard();
				} else if (tab === 'status') {
					headerTitle.innerText = '시설현황';
					renderCards();
				} else if (tab === 'manual') {
					headerTitle.innerText = '안전관리 매뉴얼';
					renderAccordion();
				} else if (tab === 'help') {
					headerTitle.innerText = 'Help';
					loadContentMobile('helpdesk', 'Help');
				}
			}

			/* 헤더 홈 버튼 */
			function goHome() {
				switchTab('home');
			}

			/* 헤더 뒤로가기 버튼 */
			function goBack() {
				if (window.history.length > 1) {
					window.history.back();
				} else {
					switchTab('home');
				}
			}

			/* ===== 홈 화면 : 공지 + 주요 메뉴 + 카드 목록 토글 ===== */

			function renderDashboard() {
				const html = `
            <div class="full-page fade-in space-y-6">
                <!-- 공지 배너 -->
                <div class="bg-blue-500 rounded-2xl p-4 text-white shadow-md">
                    <p class="text-xs font-semibold mb-1">오늘의 공지사항 📢</p>
                    <p class="text-sm">가경국민체육센터 11월 신규 개관 안내 및 회원 모집</p>
                </div>

                <!-- 주요 메뉴 -->
                <section>
                    <h2 class="text-gray-700 font-bold mb-3">주요 메뉴</h2>
                    <div class="grid grid-cols-2 gap-3">

                        <!-- 1. 업데이트 현황 -->
                        <button type="button"
                                onclick="loadContentMobile('update','업데이트 현황')"
                                class="bg-white rounded-xl shadow-sm px-4 py-3 flex items-center space-x-3 border border-gray-100">
                            <div class="w-9 h-9 rounded-full bg-green-100 flex items-center justify-center">
                                <span class="text-green-500 text-lg">✅</span>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-semibold text-gray-800">업데이트 현황</p>
                                <p class="text-[11px] text-gray-500">최신 반영 내용</p>
                            </div>
                        </button>

                        <!-- 2. 시설 안내 -->
                        <button type="button"
                                onclick="toggleFacilityList()"
                                class="bg-white rounded-xl shadow-sm px-4 py-3 flex items-center space-x-3 border border-gray-100">
                            <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center">
                                <span class="text-blue-500 text-lg">🏛</span>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-semibold text-gray-800">시설 안내</p>
                                <p class="text-[11px] text-gray-500">청주수영장 등 시설별 안내</p>
                            </div>
                        </button>

                        <!-- 3. 행정 매뉴얼 -->
                        <button type="button"
                                onclick="toggleAdminList()"
                                class="bg-white rounded-xl shadow-sm px-4 py-3 flex items-center space-x-3 border border-gray-100">
                            <div class="w-9 h-9 rounded-full bg-indigo-100 flex items-center justify-center">
                                <span class="text-indigo-500 text-lg">📂</span>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-semibold text-gray-800">행정 매뉴얼</p>
                                <p class="text-[11px] text-gray-500">시설별 행정 매뉴얼</p>
                            </div>
                        </button>

                        <!-- 4. 기술 매뉴얼 -->
                        <button type="button"
                                onclick="toggleTechList()"
                                class="bg-white rounded-xl shadow-sm px-4 py-3 flex items-center space-x-3 border border-gray-100">
                            <div class="w-9 h-9 rounded-full bg-orange-100 flex items-center justify-center">
                                <span class="text-orange-500 text-lg">📘</span>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-semibold text-gray-800">기술 매뉴얼</p>
                                <p class="text-[11px] text-gray-500">시설별 매뉴얼 선택</p>
                            </div>
                        </button>

                        <!-- 5. 체육 매뉴얼 -->
                        <button type="button"
                                onclick="togglePhyList()"
                                class="bg-white rounded-xl shadow-sm px-4 py-3 flex items-center space-x-3 border border-gray-100">
                            <div class="w-9 h-9 rounded-full bg-yellow-100 flex items-center justify-center">
                                <span class="text-yellow-500 text-lg">🏃</span>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-semibold text-gray-800">체육 매뉴얼</p>
                                <p class="text-[11px] text-gray-500">교육·운영 매뉴얼</p>
                            </div>
                        </button>

                        <!-- 6. VOC -->
                        <button type="button"
                                onclick="toggleVocList()"
                                class="bg-white rounded-xl shadow-sm px-4 py-3 flex items-center space-x-3 border border-gray-100">
                            <div class="w-9 h-9 rounded-full bg-red-100 flex items-center justify-center">
                                <span class="text-red-500 text-lg">📣</span>

			/* 하단/홈 버튼에서 사용하는 리스트 토글 공통 처리 */
			function hideAllLists(exceptId) {
				const ids = ['facility-list', 'admin-list', 'tech-list', 'phy-list', 'voc-list'];
				ids.forEach((id) => {
					const el = document.getElementById(id);
					if (!el) return;
					if (id === exceptId) {
						const willShow = el.classList.contains('hidden');
						if (willShow) {
							el.classList.remove('hidden');
							el.classList.add('fade-in');
						} else {
							el.classList.add('hidden');
							el.classList.remove('fade-in');
						}
					} else {
						el.classList.add('hidden');
						el.classList.remove('fade-in');
					}
				});
			}
