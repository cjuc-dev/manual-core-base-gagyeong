<!-- 상위 테이블 -->

<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>회원 접수 변경 및 이월월</title>
		<!-- ✅ 기본 글로벌 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/global.css" />
		<!-- 🛠 전체적인 페이지 기본 스타일 (폰트, 여백, 색상 등) -->

		<!-- ✅ 사이드바 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/sidebar_styles.css" />
		<!-- 🛠 사이드바 UI 스타일 (메뉴, 토글 기능, 레이아웃 관련 스타일) -->

		<!-- ✅ 테이블 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/table_styles.css" />
		<!-- 🛠 테이블 디자인 및 정렬 스타일 (테두리, 배경색, 크기 조정 등) -->

		<!-- ✅ 이미지 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/image_styles.css" />
		<!-- 🛠 페이지 내 이미지 관련 스타일 (크기, 정렬, 여백 등) -->

		<!-- ✅ 툴팁 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/tooltip_styles.css" />
		<!-- 🛠 툴팁 UI 스타일 (호버 시 설명 표시, 애니메이션 효과 등) -->

		<!-- ✅ 팝업 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/popup_styles.css" />
		<!-- 🛠 팝업창 및 이미지 확대 표시 관련 스타일 -->

		<!-- ✅ 기타 UI 스타일 (추가 필요 시) -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/ui_components.css" />
		<!-- 🛠 UI 구성 요소 스타일 (버튼, 레이아웃, 폰트 스타일 등) -->

		<!-- ✅ 이미지 팝업 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/image_popup.css" />
		<!-- 🛠 이미지 팝업 효과 적용 (클릭 시 확대 표시, 팝업 UI) -->
	</head>
	<body>
		<table style="width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed">
			<tr>
				<td style="width: 90%; border: 1px solid #ccc; text-align: left; padding: 10px">
					<ul style="list-style-type: disc; padding-left: 20px; margin: 0">
						<table style="width: 100%; border-collapse: collapse">
							<tr>
								<ul style="list-style-type: none; padding-left: 0; margin: 0">
									<li>
										<h3>
											<strong
												onclick="toggleDiv('pooldrain')"
												style="cursor: pointer; color: rgb(0, 0, 0)">
												1️⃣ 강습료 반환📋
											</strong>
										</h3>
									</li>
								</ul>
								<div
									id="pooldrain"
									style="display: none; flex: 1; padding-right: 20px; margin-top: 10px">
									<ul style="list-style-type: disc; padding-left: 20px; margin: 0">
										<li>환불신청서를 작성한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="https://manual-5d03dc.gitlab.io/manual_image/image_2_2_5_4_4_6.jpg"
													class="popup-image"
													alt="수영장 설비 컨트롤화면"
													onclick="openPopup(this.src)" />
												<div class="overlay-text">수동 전환</div>
											</div>
										</div>
										<li>
											환불신청서에 작성된 내용을 회원관리-회원접수변경-접수내역을 통해서 강습 및
											자유수영을 확인을 한다.
										</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="https://manual-5d03dc.gitlab.io/manual_image/image_2_2_5_4_4_6.jpg"
													class="popup-image"
													alt="수영장 설비 컨트롤화면"
													onclick="openPopup(this.src)" />
												<div class="overlay-text">수동 전환</div>
											</div>
										</div>
										<li>공제금액과 환불금액을 확인후 고객에게 공지를 한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="https://manual-5d03dc.gitlab.io/manual_image/image_2_2_5_4_4_6.jpg"
													class="popup-image"
													alt="수영장 설비 컨트롤화면"
													onclick="openPopup(this.src)" />
												<div class="overlay-text">수동 전환</div>
											</div>
										</div>
										<li>강습 및 반환을 선택후 반환 사유 및 반환 계좌번호를 작성을 한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="https://manual-5d03dc.gitlab.io/manual_image/image_2_2_5_4_4_6.jpg"
													class="popup-image"
													alt="수영장 설비 컨트롤화면"
													onclick="openPopup(this.src)" />
												<div class="overlay-text">수동 전환</div>
											</div>
										</div>
									</ul>
								</div>
							</tr>
						</table>
					</ul>
				</td>
			</tr>
		</table>
		<!-- 팝업 이미지 -->
		<!-- ✅ 기본적으로 팝업을 숨김 -->
		<div id="popup" onclick="closePopup()" style="display: none; z-index: 9999">
			<span>&times;</span>
			<img id="popup-img" src="" alt="사진" />
		</div>
	</body>
	<script src="https://manual-5d03dc.gitlab.io/javaScript/popup.js"></script>
	<script src="https://manual-5d03dc.gitlab.io/javaScript/toggle.js"></script>
</html>
