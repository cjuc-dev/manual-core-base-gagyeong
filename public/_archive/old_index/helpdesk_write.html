<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>문의 작성</title>
		<link rel="stylesheet" href="styles.css" />
		<style>
			.form-container {
				width: 50%;
				margin: 50px auto;
				padding: 20px;
				border: 1px solid #ddd;
				border-radius: 8px;
				background-color: #f9f9f9;
			}
			.form-container label {
				font-weight: bold;
				display: block;
				margin-top: 10px;
			}
			.form-container input,
			.form-container select,
			.form-container textarea {
				width: calc(100% - 16px);
				padding: 8px;
				margin-top: 5px;
				border: 1px solid #ddd;
				border-radius: 4px;
				display: block;
			}
			.form-container textarea {
				height: 100px;
			}
			.form-buttons {
				margin-top: 15px;
				text-align: center;
			}
			.form-buttons button {
				padding: 10px 20px;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				margin: 5px;
			}
			.submit-btn {
				background-color: #03c75a;
				color: white;
			}
			.cancel-btn {
				background-color: #ccc;
			}
		</style>
	</head>
	<body>
		<div class="form-container">
			<h2>문의 작성</h2>
			<form id="inquiryForm">
				<label>문의 유형</label>
				<select id="inquiryType">
					<option value="">문의유형 선택</option>
					<option>상품문의</option>
					<option>배송문의</option>
				</select>
				<label>제목</label>
				<input type="text" id="inquiryTitle" placeholder="제목 입력" />
				<label>내용</label>
				<textarea id="inquiryContent" placeholder="내용 입력"></textarea>
				<label>작성자 암호</label>
				<input type="password" id="inquiryPassword" placeholder="암호 입력" />
				<div class="form-buttons">
					<button type="button" class="submit-btn" id="submitInquiry">작성 완료</button>
					<button type="button" class="cancel-btn" onclick="cancelInquiry()">취소</button>
				</div>
			</form>
		</div>

		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const params = new URLSearchParams(window.location.search);
				const isEdit = params.has('edit');
				const index = isEdit ? parseInt(params.get('edit'), 10) : null;
				let inquiries = JSON.parse(localStorage.getItem('inquiries')) || [];

				// ✅ 수정 모드라면 기존 데이터 불러오기
				if (isEdit && inquiries[index]) {
					document.getElementById('inquiryType').value = inquiries[index].type;
					document.getElementById('inquiryTitle').value = inquiries[index].title;
					document.getElementById('inquiryContent').value = inquiries[index].content;
					document.getElementById('inquiryPassword').value = inquiries[index].password;
				}

				document.getElementById('submitInquiry').addEventListener('click', function () {
					const type = document.getElementById('inquiryType').value;
					const title = document.getElementById('inquiryTitle').value;
					const content = document.getElementById('inquiryContent').value;
					const password = document.getElementById('inquiryPassword').value;

					if (!title || !content || !password || type === '') {
						alert('모든 항목을 입력해주세요.');
						return;
					}

					if (isEdit && inquiries[index]) {
						// ✅ 기존 데이터 업데이트
						inquiries[index] = {
							type,
							title,
							content,
							password,
							date: inquiries[index].date, // 기존 날짜 유지
							views: inquiries[index].views, // 기존 조회수 유지
						};
						console.log('🔄 기존 데이터 수정 완료');
					} else {
						// ✅ 신규 데이터 추가
						inquiries.push({
							type,
							title,
							content,
							password,
							date: new Date().toISOString().split('T')[0],
							views: 0,
						});
						console.log('➕ 신규 데이터 추가 완료');
					}

					localStorage.setItem('inquiries', JSON.stringify(inquiries));
					window.location.href = 'helpdesk_main.html'; // 메인 페이지로 이동
				});
			});

			function cancelInquiry() {
				window.location.href = 'helpdesk_main.html';
			}
		</script>
	</body>
</html>
