<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>공지사항</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background-color: #f4f4f4;
				text-align: center;
				padding: 20px;
			}
			.notice-container {
				background: white;
				padding: 20px;
				border-radius: 10px;
				box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
				max-width: 500px;
				margin: auto;
				position: relative;
			}
			.highlight {
				color: #ff5733;
				font-size: 20px;
				font-weight: bold;
			}
			.contact {
				font-weight: bold;
				margin-top: 10px;
				color: #333;
			}
			.hide-today {
				text-align: right;
				margin-top: 10px;
				font-size: 14px;
				color: #555;
			}
		</style>
	</head>
	<body>
		<div id="notice" class="notice-container">
			<h2>📢 체육시설 통합 매뉴얼 공지사항</h2>
			<h3 class="highlight">메인 페이지 구현 현황 안내</h3>

			<p style="text-align: left; margin-left: 30px">1️⃣ 업데이트 현황 ✅ 구현 완료</p>
			<p style="text-align: left; margin-left: 30px">2️⃣ 시설현황 ✅ 구현 완료</p>
			<p style="text-align: left; margin-left: 30px">3️⃣ 시설안내 ✅ 구현 완료(시설별 내용 작성 필요)</p>
			<p style="text-align: left; margin-left: 30px">4️⃣ 매뉴얼</p>

			<div style="text-align: left; margin-left: 40px">
				<span>🔹 행정분야 ❌ 미구현</span>
				<br />
				<span>🔹 기술분야 ✅ 가경국민체육센터 일부 구현</span>
				<br />
				<span>🔹 체육분야 ❌</span>
			</div>
			<p style="text-align: left; margin-left: 30px">5️⃣ ❌ 미구현</p>

			<p style="margin-top: 10px; text-align: center">감사합니다.</p>
			<p class="contact">
				📞
				<strong>문의 | 043-820-7242&nbsp;&nbsp;&nbsp;&nbsp;체육사업부 박영규</strong>
			</p>

			<div class="hide-today">
				<input type="checkbox" id="hideNotice" onclick="hideForToday()" />
				오늘 하루 보지 않기
			</div>
		</div>

		<script>
			function hideForToday() {
				if (document.getElementById('hideNotice').checked) {
					let now = new Date();
					let expireTime = new Date(now.getTime() + 24 * 60 * 60 * 1000);
					document.cookie = 'hideNotice=true; expires=' + expireTime.toUTCString() + '; path=/';
					document.getElementById('notice').style.display = 'none';
				}
			}

			function checkNotice() {
				if (document.cookie.indexOf('hideNotice=true') !== -1) {
					document.getElementById('notice').style.display = 'none';
				}
			}

			window.onload = checkNotice;
		</script>
	</body>
</html>
