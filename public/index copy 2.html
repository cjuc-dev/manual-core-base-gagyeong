<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>중첩 서브메뉴 테스트</title>
		<style>
			body {
				font-family: Arial, sans-serif;
			}
			.sidebar {
				width: 250px;
				background-color: #2c3e50;
				color: white;
				padding: 15px;
				height: 100vh;
			}
			.sidebar ul {
				list-style-type: none;
				padding-left: 0;
			}
			.sidebar li {
				margin-bottom: 10px;
			}
			.sidebar a {
				color: white;
				text-decoration: none;
				font-weight: bold;
				display: block;
				padding: 8px;
				border-radius: 4px;
			}
			.sidebar a:hover {
				background-color: #1abc9c;
			}
			.submenu,
			.submenu2 {
				display: none;
				padding-left: 15px;
			}
			.submenu.show,
			.submenu2.show {
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="sidebar">
			<ul>
				<li>
					<a href="#" onclick="toggleMenu('manual')">매뉴얼</a>
					<ul id="manual" class="submenu">
						<li><a href="#" onclick="loadContent('admin')">행정</a></li>
						<li><a href="#" onclick="loadContent('tech')">기술</a></li>
						<li>
							<a href="#" onclick="toggleMenu('phy')">체육</a>
							<ul id="phy" class="submenu2">
								<li><a href="#" onclick="loadContent('phy_manual_1')">체육시설 안전관리 매뉴얼</a></li>
								<li><a href="#" onclick="loadContent('phy_manual_2')">심폐소생술</a></li>
								<li><a href="#" onclick="loadContent('phy_manual_3')">자동심장충격기(AED)</a></li>
								<li><a href="#" onclick="loadContent('phy_manual_4')">대상별 하임리히법</a></li>
							</ul>
						</li>
					</ul>
				</li>
			</ul>
		</div>

		<script>
			function toggleMenu(menuId) {
				const targetMenu = document.getElementById(menuId);
				const isSubmenu2 = targetMenu.classList.contains('submenu2');

				if (isSubmenu2) {
					document.querySelectorAll('.submenu2').forEach((menu) => {
						if (menu !== targetMenu) menu.classList.remove('show');
					});

					// ✅ 상위 submenu 강제로 열어주기
					const parentSub = targetMenu.closest('.submenu');
					if (parentSub && !parentSub.classList.contains('show')) {
						parentSub.classList.add('show');
					}

					targetMenu.classList.toggle('show');
				} else {
					document.querySelectorAll('.submenu').forEach((menu) => {
						if (menu !== targetMenu) menu.classList.remove('show');
					});
					targetMenu.classList.toggle('show');
				}
			}

			function loadContent(id) {
				alert(id + '\uac00 \ub85c\ub4dc\ub418\uc5c8\uc2b5\ub2c8\ub2e4.');
			}
		</script>
	</body>
</html>
