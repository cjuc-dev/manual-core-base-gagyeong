<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가경국민체육센터 행정 분야 매뉴얼</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index_main_v1.css">
    <link rel="stylesheet" href="css/index_content_v1.css">
    
    <!-- 인라인 콘텐츠 다크 테마 오버라이드 -->
    <style>
        /* Body 다크 배경 강제 적용 - Tailwind 기본값 덮어쓰기 */
        body {
            background-color: #0a0e1a !important;
            background-image: 
                linear-gradient(90deg, rgba(6, 214, 160, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(6, 214, 160, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 20% 50%, rgba(6, 214, 160, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%) !important;
            background-size: 50px 50px, 50px 50px, 100% 100%, 100% 100% !important;
            background-attachment: fixed !important;
        }
        
        /* 인라인 로드된 매뉴얼 콘텐츠의 다크 테마 스타일 오버라이드 */
        #member_ticket_container .voc-details {
            background-color: #1f2937 !important;
            border-color: #374151 !important;
        }
        #member_ticket_container .voc-details[open] {
            background-color: #111827 !important;
            border-color: #3b82f6 !important;
        }
        #member_ticket_container .voc-title-text {
            color: #f3f4f6 !important;
        }
        #member_ticket_container .voc-q-badge {
            color: #60a5fa !important;
        }
        #member_ticket_container .voc-arrow {
            color: #9ca3af !important;
        }
        #member_ticket_container .voc-body {
            border-top-color: #374151 !important;
            color: #d1d5db !important;
        }
        #member_ticket_container .voc-body p,
        #member_ticket_container .voc-body ul li {
            color: #d1d5db !important;
        }
        #member_ticket_container .image-wrapper {
            border-color: #374151 !important;
            background-color: #111827 !important;
        }
        #member_ticket_container .voc-label.content {
            background-color: #4b5563 !important;
        }
        #member_ticket_container table,
        #member_ticket_container td {
            background-color: transparent !important;
            border-color: #374151 !important;
        }
        
        /* 확장형 레이아웃 스타일 */
        .expanded-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e1a;
            z-index: 100;
            overflow-y: auto;
        }
        
        .expanded-view.active {
            display: block;
        }
        
        @media (min-width: 1024px) {
            .expanded-content-grid {
                display: grid;
                grid-template-columns: 300px 1fr;
                gap: 0;
                min-height: 100vh;
            }
            
            .expanded-left-panel {
                background: #1a1f2e;
                border-right: 1px solid rgba(6, 214, 160, 0.2);
                padding: 24px;
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
            }
            
            .expanded-right-panel {
                padding: 24px;
                overflow-y: auto;
            }
        }
        
        @media (max-width: 1023px) {
            .expanded-content-grid {
                display: flex;
                flex-direction: column;
            }
            
            .expanded-left-panel,
            .expanded-right-panel {
                padding: 16px;
            }
        }
    </style>

</head>
<body class="p-4 sm:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 헤더 및 타이틀 -->
        <header class="text-center py-12 mb-10 border-b border-gray-700/50 relative">
            <!-- Firebase 연결 테스트 버튼 -->
            <!-- Firebase 연결 테스트 버튼 제거 -->
            <!-- <button onclick="testFirebaseConnection(this)" class="absolute top-4 right-4 px-3 py-1.5 rounded-md bg-gray-900/50 border border-cyan-500/30 hover:border-cyan-400 hover:bg-cyan-500/10 text-cyan-400 text-xs font-medium transition-all duration-200 flex items-center gap-1.5 backdrop-blur-sm">
                <i data-lucide="database" class="w-3 h-3"></i>
                <span>Firebase 연결 테스트</span>
            </button> -->
            
            <div class="flex justify-center items-center gap-6">
                <!-- 캐릭터 이미지 추가 -->
                <div class="character-container">
                    <img src="sports_facility_image/character_swimming_v1.png" alt="Sports Facility Character" class="h-40 w-auto object-contain animate-bounce-slow character-natural-shadow">
                </div>
                
                <div class="text-left">
                    <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white neon-text-shadow">
                        가경국민체육센터 <br class="hidden sm:block"> <span class="text-cyan-400">행정 분야 매뉴얼</span>
                    </h1>
                    <p class="mt-4 text-xl font-light text-gray-400">
                        Gagyeong Sports Center Administrative Manual
                    </p>
                </div>
            </div>
        </header>

        <!-- 메인 레이아웃 -->
        <main class="w-full">
            
            <!-- 메인 콘텐츠: 행정 매뉴얼 카드 그리드 -->
            <section class="w-full">
                
                <!-- 메인으로 돌아가기 버튼 -->
                <div class="mb-6">
                    <button onclick="location.href='index_renewal2.html'" class="text-emerald-400 hover:text-emerald-300 flex items-center transition duration-200 font-bold">
                        <i data-lucide="home" class="w-5 h-5 mr-2"></i> 통합 대시보드 (Home)
                    </button>
                </div>

                <div id="dashboardView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                    <!-- 1. 입장 및 회원 관리 (Expandable) -->
                    <div id="member_card" class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group">
                        <div class="flex justify-between items-start" onclick="toggleCard('member_card', 'memberSelector', 'memberToggleIcon')">
                            <div class="flex items-start gap-4">
                                <div class="p-3 rounded-xl bg-blue-500/10 text-blue-400 group-hover:bg-blue-500/20 transition">
                                    <i data-lucide="ticket" class="w-8 h-8"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-bold mb-1 text-white group-hover:text-blue-300 transition">입장 및 회원 관리</h2>
                                    <p class="text-sm text-gray-400">발매/등록/변경 관리</p>
                                </div>
                            </div>
                            <i id="memberToggleIcon" data-lucide="chevron-down" class="w-6 h-6 text-blue-400 transition-transform duration-300"></i>
                        </div>

                        <!-- 서브 메뉴 -->
                        <div id="memberSelector" class="mt-4 pt-4 border-t border-gray-700 hidden space-y-2.5">
                            <!-- 1-1. 입장권 발매 및 취소 -->
                            <div class="flex flex-col rounded-lg bg-gray-700/40 border border-gray-600/40 hover:border-blue-500/50 transition-all duration-200">
                                <div onclick="toggleInlineExternalContent('member_ticket_container', 'gagyeong_sportscenter/admin_manual/manual_2_1_5_1_1_v2.html')" class="cursor-pointer hover:bg-blue-600/10 p-3.5 rounded-lg transition-all duration-200 group">
                                    <div class="flex items-start gap-3">
                                        <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                                            <i data-lucide="ticket" class="w-4 h-4 text-blue-400"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <h3 class="text-sm font-semibold text-blue-100 mb-1 group-hover:text-white transition-colors">입장권 발매 및 취소</h3>
                                            <p class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors">발매, 취소, 환불 처리</p>
                                        </div>
                                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500 group-hover:text-blue-400 transition-all group-hover:translate-x-0.5"></i>
                                    </div>
                                </div>
                                <div id="member_ticket_container" class="hidden mt-0 border-t border-gray-600/50 bg-gray-800/30 p-4 rounded-b-lg"></div>
                            </div>

                            <!-- 1-2. 회원 접수 등록 -->
                            <div class="flex flex-col rounded-lg bg-gray-700/40 border border-gray-600/40 hover:border-blue-500/50 transition-all duration-200">
                                <div onclick="toggleInlineContent('member_registration_container', 'member_registration')" class="cursor-pointer hover:bg-blue-600/10 p-3.5 rounded-lg transition-all duration-200 group">
                                    <div class="flex items-start gap-3">
                                        <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                                            <i data-lucide="user-plus" class="w-4 h-4 text-blue-400"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <h3 class="text-sm font-semibold text-blue-100 mb-1 group-hover:text-white transition-colors">회원 접수 등록</h3>
                                            <p class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors">신규 회원 접수</p>
                                        </div>
                                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500 group-hover:text-blue-400 transition-all group-hover:translate-x-0.5"></i>
                                    </div>
                                </div>
                                <div id="member_registration_container" class="hidden mt-0 border-t border-gray-600/50 bg-gray-800/30 p-4 rounded-b-lg"></div>
                            </div>

                            <!-- 1-3. 회원 접수 변경 및 이월 -->
                            <div class="flex flex-col rounded-lg bg-gray-700/40 border border-gray-600/40 hover:border-blue-500/50 transition-all duration-200">
                                <div onclick="toggleInlineContent('member_change_container', 'member_change')" class="cursor-pointer hover:bg-blue-600/10 p-3.5 rounded-lg transition-all duration-200 group">
                                    <div class="flex items-start gap-3">
                                        <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
                                            <i data-lucide="refresh-cw" class="w-4 h-4 text-blue-400"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <h3 class="text-sm font-semibold text-blue-100 mb-1 group-hover:text-white transition-colors">회원 접수 변경 및 이월</h3>
                                            <p class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors">기간 변경 및 이월</p>
                                        </div>
                                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500 group-hover:text-blue-400 transition-all group-hover:translate-x-0.5"></i>
                                    </div>
                                </div>
                                <div id="member_change_container" class="hidden mt-0 border-t border-gray-600/50 bg-gray-800/30 p-4 rounded-b-lg"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 강습 관리 -->
                    <div class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group" onclick="loadContent('lesson_management')">
                        <div class="flex items-start gap-4">
                            <div class="p-3 rounded-xl bg-green-500/10 text-green-400 group-hover:bg-green-500/20 transition">
                                <i data-lucide="waves" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold mb-1 text-white group-hover:text-green-300 transition">강습 관리</h2>
                                <p class="text-sm text-gray-400">이용료/강습 등록</p>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 대관 관리 -->
                    <div class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group" onclick="loadContent('rental_management')">
                        <div class="flex items-start gap-4">
                            <div class="p-3 rounded-xl bg-purple-500/10 text-purple-400 group-hover:bg-purple-500/20 transition">
                                <i data-lucide="calendar-days" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold mb-1 text-white group-hover:text-purple-300 transition">대관 관리</h2>
                                <p class="text-sm text-gray-400">예약/부속 사용료</p>
                            </div>
                        </div>
                    </div>

                    <!-- 4. 키오스크 관리 -->
                    <div class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group" onclick="loadContent('kiosk_management')">
                        <div class="flex items-start gap-4">
                            <div class="p-3 rounded-xl bg-yellow-500/10 text-yellow-400 group-hover:bg-yellow-500/20 transition">
                                <i data-lucide="monitor" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold mb-1 text-white group-hover:text-yellow-300 transition">키오스크 관리</h2>
                                <p class="text-sm text-gray-400">기기 관리</p>
                            </div>
                        </div>
                    </div>

                    <!-- 5. 락커룸 관리 -->
                    <div class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group" onclick="loadContent('locker_management')">
                        <div class="flex items-start gap-4">
                            <div class="p-3 rounded-xl bg-orange-500/10 text-orange-400 group-hover:bg-orange-500/20 transition">
                                <i data-lucide="lock" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold mb-1 text-white group-hover:text-orange-300 transition">락커룸 관리</h2>
                                <p class="text-sm text-gray-400">락맨 시스템/입장문</p>
                            </div>
                        </div>
                    </div>

                    <!-- 6. 수입금 관리 -->
                    <div class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group" onclick="loadContent('revenue_management')">
                        <div class="flex items-start gap-4">
                            <div class="p-3 rounded-xl bg-red-500/10 text-red-400 group-hover:bg-red-500/20 transition">
                                <i data-lucide="circle-dollar-sign" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold mb-1 text-white group-hover:text-red-300 transition">수입금 관리</h2>
                                <p class="text-sm text-gray-400">매출/카드 누락 확인</p>
                            </div>
                        </div>
                    </div>

                    <!-- 7. 주차장 관리 -->
                    <div class="neon-module bg-gray-800 p-6 shadow-lg cursor-pointer hover:bg-gray-700/50 transition border border-gray-700/50 hover:border-emerald-500/50 group" onclick="loadContent('parking_management')">
                        <div class="flex items-start gap-4">
                            <div class="p-3 rounded-xl bg-slate-500/10 text-slate-400 group-hover:bg-slate-500/20 transition">
                                <i data-lucide="car" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold mb-1 text-white group-hover:text-slate-300 transition">주차장 관리</h2>
                                <p class="text-sm text-gray-400">정기권/정산/차단기</p>
                            </div>
                        </div>
                    </div>

                </div>
                
                <!-- 콘텐츠 뷰어 (Content Viewer) -->
                <div id="contentView" class="hidden">
                    <button onclick="showDashboard()" class="text-emerald-400 hover:text-emerald-300 mb-6 flex items-center transition duration-200 font-bold">
                        <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> 매뉴얼 목록으로 돌아가기
                    </button>
                    
                    <div id="content-area" class="bg-gray-800 p-8 shadow-2xl min-h-[500px] rounded-xl border border-white/10 relative">
                        <!-- 여기에 동적으로 콘텐츠가 로드됩니다 -->
                        <div class="flex flex-col items-center justify-center h-full text-gray-500">
                            <i data-lucide="loader" class="w-10 h-10 animate-spin mb-4"></i>
                            <p>콘텐츠를 불러오는 중입니다...</p>
                        </div>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- Custom Scripts -->
    <script src="js/index_ui_v1.js"></script>
    <script src="js/index_content_v1.js"></script>
    <script src="js/index_firebase_v1.js"></script>
</body>
</html>
