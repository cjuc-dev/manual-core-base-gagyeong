<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>체육시설 통합 매뉴얼</title>
		<link
			rel="stylesheet"
			href="https://manual-5d03dc.gitlab.io/css/styles_main.css"
			href="https://manual-5d03dc.gitlab.io/css/icon.css"
		/>
	</head>
	<body>
		<div class="sidebar">
			<h2>체육시설 통합 매뉴얼</h2>
			<ul>
				<li><a href="#" onclick="loadContent('update')">업데이트 현황</a></li>
				<li><a href="#" onclick="loadContent('facility')">시설현황</a></li>
				<li>
					<a href="#" onclick="toggleMenu('guide')">시설안내</a>
					<ul id="guide" class="hidden">
						<li>
							<a href="#" onclick="loadContent('cheongjuSwimming')"
								>청주수영장</a
							>
						</li>
						<li>
							<a href="#" onclick="loadContent('purmi')">푸르미스포츠센터</a>
						</li>
						<li>
							<a href="#" onclick="loadContent('youngun_sportscenter')"
								>영운국민체육센터</a
							>
						</li>
						<li>
							<a href="#" onclick="loadContent('bokdae_sportscenter')"
								>복대국민체육센터</a
							>
						</li>
						<li>
							<a href="#" onclick="loadContent('gagyeong_sportscenter')"
								>가경국민체육센터</a
							>
						</li>
					</ul>
				</li>
				<li>
					<a href="#" onclick="toggleMenu('manual')">매뉴얼</a>
					<ul id="manual" class="hidden">
						<li><a href="#" onclick="loadContent('admin')">행정</a></li>
						<li><a href="#" onclick="loadContent('tech')">기술</a></li>
						<li><a href="#" onclick="loadContent('phy')">체육</a></li>
					</ul>
				</li>
				<li><a href="#" onclick="loadContent('voc')">VOC</a></li>
			</ul>
			<div class="sidebar-footer">
				<p>v1.09</p>
				<p>creator: 박영규, 박현수</p>
			</div>
		</div>

		<div id="main-content" class="main-content">
			<div id="content-area">
				<h3>여기에 클릭된 메뉴의 내용이 표시됩니다.</h3>
			</div>
		</div>
		<script>
			function loadContent(section) {
				var contentArea = document.getElementById("content-area");

				if (section === "update") {
					contentArea.innerHTML = `<iframe src="https://manual-5d03dc.gitlab.io/updatecontainer/updatecontainer_main.html" 
                                        style="width:100%; height:100vh; border:none;"></iframe>`;
				} else {
					switch (section) {
						case "facility":
							fetch("https://manual-5d03dc.gitlab.io/facility.html")
								.then((response) => response.text())
								.then((data) => (contentArea.innerHTML = data))
								.catch((error) => {
									contentArea.innerHTML =
										"<p>콘텐츠를 불러오는 데 실패했습니다.</p>";
									console.error("Error loading the content:", error);
								});
							break;

						case "cheongjuSwimming":
							fetch(
								"https://manual-5d03dc.gitlab.io/guide/cheongju_swimming_pool_guide.html"
							)
								.then((response) => response.text())
								.then((data) => (contentArea.innerHTML = data));
							break;

						case "purmi":
							fetch("https://manual-5d03dc.gitlab.io/guide/purmi_guide.html")
								.then((response) => response.text())
								.then((data) => (contentArea.innerHTML = data));
							break;

						case "youngun_sportscenter":
							fetch(
								"https://manual-5d03dc.gitlab.io/guide/youngun_sportscenter_guide.html"
							)
								.then((response) => response.text())
								.then((data) => (contentArea.innerHTML = data));
							break;

						case "bokdae_sportscenter":
							fetch(
								"https://manual-5d03dc.gitlab.io/guide/bokdae_sportscenter_guide.html"
							)
								.then((response) => response.text())
								.then((data) => (contentArea.innerHTML = data));
							break;

						case "gagyeong_sportscenter":
							fetch(
								"https://manual-5d03dc.gitlab.io/guide/gagyeong_sportscenter_guide.html"
							)
								.then((response) => response.text())
								.then((data) => (contentArea.innerHTML = data));
							break;

						case "voc":
							contentArea.innerHTML =
								"<h2>VOC</h2><p>고객의 소리를 확인하세요.</p>";
							break;

						case "admin":
						case "tech":
						case "phy":
							contentArea.innerHTML = generateContent(section);
							break;

						default:
							contentArea.innerHTML = "<p>올바른 섹션이 아닙니다.</p>";
					}
				}
			}

			function generateContent(section) {
				const contentTemplates = {
					admin: `
                    <p><img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png">
                    <a href="#" class="custom-link">청주수영장 행정분야</a>를 클릭하면 이동합니다. <미구현></p>
                `,
					tech: `
                    <p><img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png">
                    <a href="#" class="custom-link">청주수영장 기술분야</a>를 클릭하면 이동합니다. <미구현></p>
                `,
					phy: `
                    <p><img src="https://manual-5d03dc.gitlab.io/icon/link_icon.png">
                    <a href="#" class="custom-link">체육분야</a>를 클릭하면 이동합니다. <미구현></p>
                `,
				};
				return contentTemplates[section] || "<p>올바른 섹션이 아닙니다.</p>";
			}

			function toggleMenu(menuId) {
				var menus = document.querySelectorAll(".sidebar ul ul");
				menus.forEach((menu) => {
					if (menu.id !== menuId) {
						menu.classList.add("hidden");
					}
				});

				var menu = document.getElementById(menuId);
				menu.classList.toggle("hidden");
			}
		</script>
	</body>
</html>
