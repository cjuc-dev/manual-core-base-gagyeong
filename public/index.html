				};

					);

		<style>
			/* 기본적으로 숨겨져 있는 클래스 */

			/* 방문한 링크 및 일반 링크 모두 동일한 스타일 적용 */
			a.menu-link,
			a.menu-link:visited,
			a.menu-link:hover {
				color: #070707 !important; /* 기본 검정색 유지 */
				text-decoration: none !important; /* 밑줄 제거 */
				font-weight: bold; /* 글자 두껍게 */
			}

			//* 모든 링크의 스타일을 동일하게 유지 */
			.menu-link,
			.menu-link:visited {
				color: #070707 !important; /* 동일한 검정색 유지 */
				text-decoration: none !important; /* 밑줄 제거 */
				font-weight: bold;
			}

			/* 방문한 링크 스타일 */
			.menu-link:visited {
				color: #070707 !important; /* 방문 후에도 색상 유지 */
				text-decoration: none !important;
			}

			/* 링크 마우스 오버 시 스타일 */
			.menu-link:hover {
				color: #0056b3; /* 마우스 오버 시 어두운 파란색으로 변경 */
			}

			/* 특정 강조 텍스트 스타일 */
			.highlight {
				color: #007bff !important; /* 특정 단어 강조 (파란색) */
				font-weight: bold;
			}

			/* 항상 보이는 아이콘 스타일 */

				background-color: transparent; /* 배경색을 투명으로 설정 */
			}

			/* 마우스를 올리면 나타나는 아이콘 스타일 */
			.hover-icon {
				width: 20px; /* 아이콘 너비 설정 */
				height: 20px; /* 아이콘 높이 설정 */
				margin-left: 10px; /* 링크와의 간격 조정 */
				display: none; /* 기본적으로 숨김 */
				background-color: transparent; /* 배경색을 투명으로 설정 */
			}

			/* 링크에 마우스를 올리면 hover-icon이 나타남 */
			.menu-link:hover + .hover-icon {
				display: inline; /* 마우스 오버 시 아이콘 표시 */
			}
