image: ruby:3.1  # 사용할 Docker 이미지 (필요에 따라 변경 가능)

stages:
  - deploy

pages:
  stage: deploy
  script:
    - mkdir -p public  # public 폴더 생성 (없을 경우 대비)
    - find . -mindepth 1 -not -path "./public/*" -exec cp -r {} public/ \;
  artifacts:
    paths:
      - public
  only:
    - main  # main 브랜치에서만 실행