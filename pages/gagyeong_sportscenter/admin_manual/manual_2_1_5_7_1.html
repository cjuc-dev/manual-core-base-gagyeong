<!-- 상위 테이블 -->

<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>정기권 관리</title>
		<!-- ✅ 기본 글로벌 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/global.css" />
		<!-- 🛠 전체적인 페이지 기본 스타일 (폰트, 여백, 색상 등) -->

		<!-- ✅ 사이드바 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/sidebar_styles.css" />
		<!-- 🛠 사이드바 UI 스타일 (메뉴, 토글 기능, 레이아웃 관련 스타일) -->

		<!-- ✅ 테이블 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/table_styles.css" />
		<!-- 🛠 테이블 디자인 및 정렬 스타일 (테두리, 배경색, 크기 조정 등) -->

		<!-- ✅ 이미지 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/image_styles.css" />
		<!-- 🛠 페이지 내 이미지 관련 스타일 (크기, 정렬, 여백 등) -->

		<!-- ✅ 툴팁 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/tooltip_styles.css" />
		<!-- 🛠 툴팁 UI 스타일 (호버 시 설명 표시, 애니메이션 효과 등) -->

		<!-- ✅ 팝업 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/popup_styles.css" />
		<!-- 🛠 팝업창 및 이미지 확대 표시 관련 스타일 -->

		<!-- ✅ 기타 UI 스타일 (추가 필요 시) -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/ui_components.css" />
		<!-- 🛠 UI 구성 요소 스타일 (버튼, 레이아웃, 폰트 스타일 등) -->

		<!-- ✅ 이미지 팝업 스타일 -->
		<link rel="stylesheet" href="https://manual-5d03dc.gitlab.io/css/image_popup.css" />
		<!-- 🛠 이미지 팝업 효과 적용 (클릭 시 확대 표시, 팝업 UI) -->
	</head>
	<body>
		<table style="width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed">
			<tr>
				<style>
					/* ✅ 개별 이미지 컨테이너 */
					.image-wrapper {
						position: relative; /* ✅ 자식 요소(.overlay-text)가 이미지 위에 배치됨 */
						display: ; /* ✅ 한 줄에 나란히 배치 */
						width: 800px; /* ✅ 가로 200px 고정 */
						height: 500px; /* ✅ 세로 200px 고정 */
						text-align: center; /* ✅ 텍스트 중앙 정렬 */
						overflow: hidden; /* ✅ 넘치는 내용 감춤 */
						border-radius: 5px; /* ✅ 모서리를 둥글게 */
						margin-top: 10px; /* 필요에 따라 값을 조정하세요 */
					}
					p + .image-container {
						margin-top: -15px; /* 이미지 컨테이너 간의 간격을 늘리기 */
					}
					.image-wrapper img {
						width: 100%;
						height: 100%;
						object-fit: contain; /* ✅ 원본 비율을 유지하면서 조정 */
					}
				</style>
				<td style="width: 90%; border: 1px solid #ccc; text-align: left; padding: 10px">
					<ul style="list-style-type: disc; padding-left: 20px; margin: 0">
						<table style="width: 100%; border-collapse: collapse">
							<tr>
								<ul style="list-style-type: none; padding-left: 0; margin: 0">
									<li>
										<h3>
											<strong
												onclick="toggleDiv('Register')"
												style="cursor: pointer; color: rgb(0, 0, 0)">
												1️⃣ 정기권관리📋
											</strong>
										</h3>
									</li>
								</ul>
								<div
									id="Register"
									style="display: none; flex: 1; padding-right: 20px; margin-top: 10px">
									<ul style="list-style-type: disc; padding-left: 20px; margin: 0">
										<li>정기권 관리를 선택한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="../../../assets/images/manual/admin/gagyeong/image_2_1_5_7_1_1.jpg"
													class="popup-image"
													alt="" />
												<div class="overlay-text">정기권 관리</div>
											</div>
										</div>
										<li>정기권 등록을 선택한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="../../../assets/images/manual/admin/gagyeong/image_2_1_5_7_1_2.jpg"
													class="popup-image"
													alt="" />
												<div class="overlay-text">정기권 등록</div>
											</div>
										</div>
										<li>차량번호, 종료일자를 필수로 입력을 한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="../../../assets/images/manual/admin/gagyeong/image_2_1_5_7_1_3.jpg"
													class="popup-image"
													alt="" />
												<div class="overlay-text">차량 정보 입력</div>
											</div>
										</div>
										<p>💡 고객번호, 전화번호, 차종 등 선택사항으로 입력을 한다.</p>
										<li>감면 유형은 <정기>로 선택 후 현금을 선택 한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="../../../assets/images/manual/admin/gagyeong/image_2_1_5_7_1_4.jpg"
													class="popup-image"
													alt="" />
												<div class="overlay-text">감면유형 및 결재</div>
											</div>
										</div>
										<li>정기권현황을 선택하여 등록처리 상태를 확인한다.</li>
										<div class="image-container">
											<div class="image-wrapper">
												<img
													src="../../../assets/images/manual/admin/gagyeong/image_2_1_5_7_1_5.jpg"
													class="popup-image"
													alt="" />
												<div class="overlay-text">등록 확인</div>
											</div>
										</div>
									</ul>
								</div>
							</tr>
						</table>
					</ul>
				</td>
			</tr>
		</table>
		<!-- 팝업 이미지 -->
		<!-- ✅ 기본적으로 팝업을 숨김 -->
		<div id="popup" onclick="closePopup()" style="display: none; z-index: 9999">
			<span>&times;</span>
			<img id="popup-img" src="" alt="사진" />
		</div>
	</body>
	<script src="https://manual-5d03dc.gitlab.io/javaScript/popup.js"></script>
	<script src="https://manual-5d03dc.gitlab.io/javaScript/toggle.js"></script>
</html>
