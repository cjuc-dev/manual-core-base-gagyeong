<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 요청 (Helpdesk)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --color-voc: #fbbf24; /* Amber-400 */
        }
        
        body {
            background-color: #0f172a; /* Slate-900 matching premium styles */
            color: #f3f4f6;
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            padding: 3rem;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
        }

        .voc-input {
            background-color: #1e293b; /* Slate-800 */
            border: 1px solid #334155; /* Slate-700 */
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }
        .voc-input:focus {
            outline: none;
            border-color: var(--color-voc);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.3);
        }

        /* Glassmorphism for containers */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="vocApp" class="max-w-4xl mx-auto">
        
        <div class="flex justify-between items-end mb-8 border-b border-gray-700 pb-3">
            <h1 class="text-4xl font-bold text-amber-400">
                <i data-lucide="message-square" class="w-8 h-8 inline mr-3 align-text-bottom"></i>시스템 요청 
            </h1>
            <a href="../index.html" class="text-gray-400 hover:text-white transition-colors flex items-center">
                <i data-lucide="home" class="w-5 h-5 mr-1"></i> 메인으로
            </a>
        </div>

        <!-- VOC 작성 및 리스트 뷰 -->
        <div id="vocView">
            <!-- VOC 폼 -->
            <div id="vocForm" class="mb-10 p-6 rounded-xl shadow-lg glass-panel">
                <h4 class="text-2xl font-semibold text-white mb-4 border-b border-gray-700 pb-2">요청서 작성</h4>
                <form onsubmit="submitVoc(event)" class="space-y-4">
                    <!-- 필드: 작성자, 요청시설, 요청분야, 요청내용 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="voc-author" class="block text-sm font-medium text-gray-400 mb-1">작성자 / 연락처</label>
                            <input type="text" id="voc-author" class="w-full voc-input" placeholder="이름 또는 연락처" required>
                        </div>
                        <div>
                            <label for="voc-facility" class="block text-sm font-medium text-gray-400 mb-1">요청 시설</label>
                            <select id="voc-facility" class="w-full voc-input" required>
                                <option value="">-- 시설 선택 --</option>
                                <option value="cheongju_gym">청주체육관</option>
                                <option value="yeoungun_center">영운국민체육센터</option>
                                <option value="purumi_center">푸르미스포츠센터</option>
                                <option value="other">기타</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="voc-category" class="block text-sm font-medium text-gray-400 mb-1">요청 분야</label>
                        <select id="voc-category" class="w-full voc-input" required>
                            <option value="">-- 분야 선택 --</option>
                            <option value="equipment">장비/시설 고장</option>
                            <option value="cleanliness">환경/청결</option>
                            <option value="service">고객 서비스/민원</option>
                            <option value="management">운영 및 행정</option>
                        </select>
                    </div>
                    <div>
                        <label for="voc-content" class="block text-sm font-medium text-gray-400 mb-1">요청 내용</label>
                        <textarea id="voc-content" rows="4" class="w-full voc-input" placeholder="상세한 요청 내용을 작성해 주세요." required></textarea>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold py-3 rounded-lg transition duration-200 flex items-center justify-center shadow-lg shadow-amber-500/20">
                        <i data-lucide="send" class="w-5 h-5 mr-2"></i> 요청서 제출
                    </button>
                </form>
            </div>

            <!-- VOC 리스트 -->
            <div id="vocListContainer" class="p-6 rounded-xl shadow-lg glass-panel">
                <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                    <h4 class="text-2xl font-semibold text-white">요청 리스트 및 처리 현황</h4>
                    <button onclick="resetData()" class="text-xs text-red-400 hover:text-red-300 underline">
                        데이터 초기화
                    </button>
                </div>
                
                <button onclick="renderVocList()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg mb-4 flex items-center transition-colors">
                    <i data-lucide="rotate-cw" class="w-5 h-5 mr-2"></i> 목록 새로고침
                </button>

                <div id="vocList" class="space-y-3">
                    <!-- 목록 렌더링 영역 -->
                </div>
            </div>
        </div>
        
        <!-- VOC 상세 처리 뷰 (숨겨짐) -->
        <div id="vocDetailView" class="hidden p-6 rounded-xl shadow-lg glass-panel">
            <button onclick="showVocListView()" class="text-amber-400 hover:text-amber-300 mb-6 flex items-center transition duration-200">
                <i data-lucide="chevron-left" class="w-5 h-5 mr-1"></i> 요청 목록으로 돌아가기
            </button>
            <h3 class="text-3xl font-bold text-amber-400 mb-6 border-b border-gray-700 pb-2">
                <i data-lucide="clipboard-check" class="w-7 h-7 inline mr-2 align-text-bottom"></i>요청 상세 및 처리 (ID: <span id="vocDetailId"></span>)
            </h3>

            <div id="vocDetailContent" class="space-y-6">
                <!-- 상세 내용 로드 영역 -->
            </div>

            <div class="mt-8 border-t border-gray-700 pt-6">
                <h4 class="text-xl font-semibold text-white mb-3 flex items-center">
                    <i data-lucide="shield-alert" class="w-5 h-5 mr-2 text-red-400"></i> 관리자 처리 영역
                </h4>
                <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                    <p class="text-sm text-gray-400 mb-4">관리자 권한이 필요합니다. 비밀번호를 입력하세요.</p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">처리 상태</label>
                            <select id="adminStatus" class="w-full voc-input text-sm">
                                <option value="received">접수 완료</option>
                                <option value="processing">처리 중</option>
                                <option value="completed">처리 완료</option>
                                <option value="rejected">처리 불가</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">관리자 답변</label>
                            <textarea id="adminResponse" rows="3" class="w-full voc-input text-sm" placeholder="관리자 답변 및 처리 내용을 기록하세요."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">관리자 비밀번호</label>
                            <input type="password" id="adminPassword" class="w-full voc-input text-sm" placeholder="비밀번호 입력 (admin)">
                        </div>
                        <button onclick="saveAdminResponse()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg transition duration-200 shadow-lg shadow-indigo-500/20">
                            <i data-lucide="save" class="w-4 h-4 inline mr-2"></i> 상태/답변 저장
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lucide 아이콘 렌더링
        lucide.createIcons();
        
        // --- DATA (시설 및 VOC 정보) ---
        const facilityMap = { 'cheongju_gym': '청주체육관', 'yeoungun_center': '영운국민체육센터', 'naesu_center': '내수국민체육센터', 'purumi_center': '푸르미스포츠센터', 'other': '기타 시설' };
        const categoryMap = { 'equipment': '장비/시설 고장', 'cleanliness': '환경/청결', 'service': '고객 서비스/민원', 'management': '운영 및 행정' };
        const statusMap = {
            'received': { text: '접수 완료', color: 'gray-500', bg: 'bg-gray-500/20', border: 'border-gray-500' },
            'processing': { text: '처리 중', color: 'yellow-500', bg: 'bg-yellow-500/20', border: 'border-yellow-500' },
            'completed': { text: '처리 완료', color: 'green-500', bg: 'bg-green-500/20', border: 'border-green-500' },
            'rejected': { text: '처리 불가', color: 'red-500', bg: 'bg-red-500/20', border: 'border-red-500' }
        };

        // 초기 데이터 (LocalStorage가 비어있을 때 사용)
        const initialVocList = [
            { id: 1, author: '김관리', facility: 'cheongju_gym', category: 'equipment', content: '농구 골대 네트가 파손되었습니다. 즉시 교체 요청합니다.', status: 'completed', date: '2025-11-26', adminResponse: '농구 골대 네트 교체 완료하였습니다. 시설 이용에 문제가 없는지 확인했습니다.' },
            { id: 2, author: '익명 이용자', facility: 'purumi_center', category: 'cleanliness', content: '2층 화장실 바닥이 미끄럽고 휴지가 부족합니다.', status: 'processing', date: '2025-11-25', adminResponse: '접수 후 현장 점검 완료. 청소팀에 특별 청소 지시했으며, 주기적인 점검을 강화하겠습니다.' }
        ];

        // LocalStorage 키
        const STORAGE_KEY = 'helpdesk_voc_list';

        // 데이터 로드 함수
        function loadVocList() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            if (storedData) {
                return JSON.parse(storedData);
            } else {
                // 초기 데이터 저장
                localStorage.setItem(STORAGE_KEY, JSON.stringify(initialVocList));
                return initialVocList;
            }
        }

        // 데이터 저장 함수
        function saveVocList(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        // 현재 리스트 상태
        let currentVocList = loadVocList();

        // --- VIEW CONTROL FUNCTIONS ---
        const vocView = document.getElementById('vocView');
        const vocDetailView = document.getElementById('vocDetailView');
        const vocListElement = document.getElementById('vocList');
        const vocDetailContent = document.getElementById('vocDetailContent');
        const vocDetailId = document.getElementById('vocDetailId');

        function showVocListView() {
            vocDetailView.classList.add('hidden');
            vocView.classList.remove('hidden');
            renderVocList();
            // 비밀번호 필드 초기화
            document.getElementById('adminPassword').value = '';
        }

        function renderVocList() {
            // 최신 데이터 로드
            currentVocList = loadVocList();
            
            vocListElement.innerHTML = '';
            
            if (currentVocList.length === 0) {
                vocListElement.innerHTML = '<p class="text-center text-gray-500 py-4">등록된 요청이 없습니다.</p>';
                return;
            }

            // ID 역순 정렬 (최신순)
            const sortedList = [...currentVocList].sort((a, b) => b.id - a.id);

            sortedList.forEach(voc => {
                const statusInfo = statusMap[voc.status] || statusMap['received'];
                const facilityName = facilityMap[voc.facility] || '알 수 없음';
                
                const item = document.createElement('div');
                item.className = `p-4 bg-slate-800/50 rounded-lg border-l-4 ${statusInfo.border} hover:bg-slate-700/50 transition duration-150 cursor-pointer`;
                item.setAttribute('onclick', `showVocDetail(${voc.id})`);
                
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-lg font-semibold text-white mb-1">
                                <span class="text-gray-400 text-sm mr-2">[${facilityName}]</span>
                                ${voc.content.length > 30 ? voc.content.substring(0, 30) + '...' : voc.content}
                            </p>
                            <p class="text-sm text-gray-400">
                                <i data-lucide="user" class="w-3 h-3 inline mr-1"></i>${voc.author} 
                                <span class="mx-2">|</span> 
                                <i data-lucide="calendar" class="w-3 h-3 inline mr-1"></i>${voc.date}
                            </p>
                        </div>
                        <span class="text-xs font-bold px-2 py-1 rounded ${statusInfo.bg} text-${statusInfo.color.split('-')[0]}-400">
                            ${statusInfo.text}
                        </span>
                    </div>
                `;
                vocListElement.appendChild(item);
            });
            lucide.createIcons();
        }

        function submitVoc(event) {
            event.preventDefault();
            const author = document.getElementById('voc-author').value;
            const facility = document.getElementById('voc-facility').value;
            const category = document.getElementById('voc-category').value;
            const content = document.getElementById('voc-content').value;

            // 최신 데이터 다시 로드 (동시성 문제 최소화)
            currentVocList = loadVocList();
            
            // 새 ID 생성
            const maxId = currentVocList.length > 0 ? Math.max(...currentVocList.map(v => v.id)) : 0;
            const newId = maxId + 1;

            const newVoc = { 
                id: newId, 
                author, 
                facility, 
                category, 
                content, 
                status: 'received', 
                date: new Date().toISOString().substring(0, 10), 
                adminResponse: '' 
            };
            
            currentVocList.unshift(newVoc); 
            saveVocList(currentVocList);

            console.log('요청서 접수 완료:', newVoc);
            alert('요청서가 성공적으로 접수되었습니다! (ID: ' + newId + ')');
            
            event.target.reset();
            renderVocList();
        }

        function showVocDetail(id) {
            // 최신 데이터 로드
            currentVocList = loadVocList();
            const voc = currentVocList.find(v => v.id === id);
            if (!voc) return;

            vocView.classList.add('hidden');
            vocDetailView.classList.remove('hidden');
            vocDetailId.textContent = id;

            const statusInfo = statusMap[voc.status] || statusMap['received'];
            
            // 상세 내용 렌더링
            vocDetailContent.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <span class="text-gray-400 block text-xs uppercase tracking-wider mb-1">요청 상태</span>
                            <span class="inline-block font-bold py-1 px-3 rounded text-sm ${statusInfo.bg} text-${statusInfo.color.split('-')[0]}-400 border ${statusInfo.border}">
                                ${statusInfo.text}
                            </span>
                        </div>
                        <div>
                            <span class="text-gray-400 block text-xs uppercase tracking-wider mb-1">요청 시설</span>
                            <p class="text-white text-lg">${facilityMap[voc.facility]}</p>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <span class="text-gray-400 block text-xs uppercase tracking-wider mb-1">요청 분야</span>
                            <p class="text-white text-lg">${categoryMap[voc.category]}</p>
                        </div>
                        <div>
                            <span class="text-gray-400 block text-xs uppercase tracking-wider mb-1">작성자 / 날짜</span>
                            <p class="text-white text-lg">${voc.author} <span class="text-gray-500 text-sm">(${voc.date})</span></p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-6">
                    <span class="text-gray-400 block text-xs uppercase tracking-wider mb-2">요청 내용</span>
                    <div class="p-5 bg-slate-800 rounded-lg border border-slate-700">
                        <p class="text-gray-200 whitespace-pre-wrap leading-relaxed">${voc.content}</p>
                    </div>
                </div>

                <div class="mt-6">
                    <span class="text-gray-400 block text-xs uppercase tracking-wider mb-2">관리자 답변</span>
                    <div class="p-5 bg-slate-800 rounded-lg border border-slate-700 min-h-[100px]">
                        ${voc.adminResponse 
                            ? `<p class="text-indigo-300 whitespace-pre-wrap leading-relaxed"><i data-lucide="corner-down-right" class="w-4 h-4 inline mr-2"></i>${voc.adminResponse}</p>` 
                            : '<p class="text-gray-500 italic">아직 답변이 등록되지 않았습니다.</p>'}
                    </div>
                </div>
            `;
            
            // 관리자 처리 영역 데이터 로드
            document.getElementById('adminStatus').value = voc.status;
            document.getElementById('adminResponse').value = voc.adminResponse || '';
            
            // 버튼 이벤트 바인딩 (클로저 문제 해결을 위해 ID 전달)
            const saveBtn = document.querySelector('#vocDetailView button[onclick^="saveAdminResponse"]');
            saveBtn.onclick = () => saveAdminResponse(id);

            lucide.createIcons();
        }

        function saveAdminResponse(id) {
            const password = document.getElementById('adminPassword').value;
            
            // 비밀번호 확인
            if (password !== 'admin') {
                alert('관리자 비밀번호가 일치하지 않습니다.');
                return;
            }

            // 최신 데이터 로드
            currentVocList = loadVocList();
            const vocIndex = currentVocList.findIndex(v => v.id === id);
            
            if (vocIndex === -1) {
                alert('해당 요청을 찾을 수 없습니다.');
                return;
            }

            const newStatus = document.getElementById('adminStatus').value;
            const newResponse = document.getElementById('adminResponse').value;

            // 데이터 업데이트
            currentVocList[vocIndex].status = newStatus;
            currentVocList[vocIndex].adminResponse = newResponse;
            
            // 저장
            saveVocList(currentVocList);
            
            console.log(`VOC ID ${id} 처리 상태 저장됨: ${newStatus}`);
            alert(`처리 상태가 성공적으로 저장되었습니다. (ID: ${id})`);
            
            // 상세 뷰를 갱신하고 목록 뷰로 돌아감
            showVocListView();
        }

        function resetData() {
            if(confirm('모든 데이터를 초기화하시겠습니까? (삭제된 데이터는 복구할 수 없습니다)')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
        
        // 초기 로드 시 목록 렌더링
        document.addEventListener('DOMContentLoaded', renderVocList);
    </script>
</body>
</html>
