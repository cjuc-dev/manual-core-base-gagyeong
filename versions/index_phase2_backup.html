    <script>
        // 초기 테마 설정 확인
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleAccordion(menuId, iconId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(iconId);
            const isMenuExpanded = menu.style.maxHeight && menu.style.maxHeight !== '0px';

            if (isMenuExpanded) {
                menu.style.maxHeight = '0px';
                icon.classList.remove('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'false');
            } else {
                menu.style.maxHeight = menu.scrollHeight + 'px';
                icon.classList.add('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'true');
            }
        }

        function toggleTheme() {
            const htmlClasses = document.documentElement.classList;
            if (htmlClasses.contains('dark')) {
                htmlClasses.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlClasses.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        function loadContent(contentId) {
            if(window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }

            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
            
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');
            breadcrumbNav.classList.remove('hidden');
            breadcrumbNav.classList.add('flex');
            
            // 보안 가이드라인: DOMPurify XSS 검증
            const safeId = DOMPurify.sanitize(contentId);
            breadcrumbCurrent.textContent = "문서: " + safeId;

            const contentArea = document.getElementById('content-area');
            
            if(safeId === 'safety') {
                contentArea.innerHTML = `
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">🛡️ 체육시설 안전관리 표준매뉴얼</h2>
                    <p class="mb-4 text-gray-600 dark:text-gray-400">아래 뷰어를 통해 원본을 확인하거나 다운로드할 수 있습니다.</p>
                    <div class="w-full h-[600px] border border-gray-300 dark:border-gray-600 rounded bg-gray-100 dark:bg-gray-900 flex items-center justify-center">
                        <embed src="docs/체육시설 안전관리 표준매뉴얼.pdf" type="application/pdf" width="100%" height="100%" />
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4 capitalize">` + safeId + ` 매뉴얼</h2>
                    <p class="mb-4 leading-relaxed text-gray-700 dark:text-gray-300">이 영역에는 Phase 3에서 <strong>marked.js</strong>를 통해 변환된 마크다운(.md) 파일이 렌더링됩니다.</p>
                    
                    <div class="bg-emerald-50 dark:bg-gray-900/50 p-4 rounded text-sm text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30">
                        <i class="ph ph-check-circle inline mr-1"></i> <strong>시큐어 코딩 지침 준수</strong>
                        <ul class="list-disc pl-5 mt-2 text-gray-600 dark:text-gray-400">
                            <li>DOMPurify를 통해 XSS 악성 스크립트 렌더링 사전 차단.</li>
                            <li>개인정보 (이름, 연락처) 노출 시 즉각 마스킹 처리 로직 연동 대기 중.</li>
                        </ul>
                    </div>
                `;
            }
            
            document.getElementById('mainScrollArea').scrollTop = 0;
        }

        function showDashboard() {
            document.getElementById('contentView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            breadcrumbNav.classList.remove('flex');
            breadcrumbNav.classList.add('hidden');
        }

        window.onload = () => {
            const facilityMenu = document.getElementById('facility-menu');
            if(facilityMenu) facilityMenu.style.maxHeight = facilityMenu.scrollHeight + 'px';
        };
    </script>
</body>
</html>
