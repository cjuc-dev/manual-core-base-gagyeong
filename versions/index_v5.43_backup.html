    <script>
        // 초기 테마 설정 확인
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleAccordion(menuId, iconId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(iconId);
            const isMenuExpanded = menu.style.maxHeight && menu.style.maxHeight !== '0px';
            if (isMenuExpanded) {
                menu.style.maxHeight = '0px';
                icon.classList.remove('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'false');
            } else {
                menu.style.maxHeight = menu.scrollHeight + 'px';
                icon.classList.add('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'true');
            }
        }

        function toggleTheme() {
            const htmlClasses = document.documentElement.classList;
            if (htmlClasses.contains('dark')) {
                htmlClasses.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlClasses.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        const scrollArea = document.getElementById('mainScrollArea');
        const stickyNav = document.getElementById('stickyNav');
        if (scrollArea && stickyNav) {
            scrollArea.addEventListener('scroll', () => {
                // 🚀 [피드백 반영] 검색 네비게이터가 활성화된 상태라면 스크롤과 상관없이 항상 노출
                const isNavActive = !document.getElementById('searchNavigator').classList.contains('hidden');
                
                if (scrollArea.scrollTop > 100 || isNavActive) {
                    stickyNav.classList.remove('opacity-0', 'invisible', 'translate-y-10');
                    stickyNav.classList.add('opacity-100', 'visible', 'translate-y-0');
                } else {
                    stickyNav.classList.add('opacity-0', 'invisible', 'translate-y-10');
                    stickyNav.classList.remove('opacity-100', 'visible', 'translate-y-0');
                }
            });
        }

        function scrollToTop() {
            if (scrollArea) { scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); }
        }

        async function loadContent(contentId, facility = '공통', isPopState = false, searchQuery = null) {
            if(window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }
            
            // 🚀 [경로 동기화] 업데이트 히스토리는 항상 'data' 폴더에서 로드
            if (contentId === 'update') { facility = 'data'; }
            
            // 🚀 [네비게이터 상태 업데이트]
            updateSearchNav(contentId);
            
            const isVoc = (facility === 'voc');
            const contentArea = document.getElementById('content-area');
            if (isVoc) {
                contentArea.classList.add('voc-content');
            } else {
                contentArea.classList.remove('voc-content');
            }

            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
            if (!isPopState) {
                history.pushState({ page: 'content', id: contentId, facility: facility }, '', '?doc=' + encodeURIComponent(contentId) + '&facility=' + encodeURIComponent(facility));
            }
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');
            breadcrumbNav.classList.remove('hidden');
            breadcrumbNav.classList.add('flex');
            const safeId = DOMPurify.sanitize(contentId);
            const titleMap = {
                '행정_매뉴얼': '행정 (Admin)', '기술_매뉴얼': '기술 (Tech)', 'safety': '안전관리 표준매뉴얼',
                'cheongjuSwimming_guide': '청주수영장', 'purmi_guide': '푸르미스포츠센터', 'youngun_sportscenter_guide': '영운국민체육센터',
                'bokdae_sportscenter_guide': '복대국민체육센터', 'gagyeong_sportscenter_guide': '가경국민체육센터',
                'sannam_sportscenter_guide': '산남국민체육센터', 'update': '업데이트 히스토리',
                'system_inquiry': '시스템 문의/요청',
                'swimming': '수영장', 'gym': '다목적체육관', 'program': '프로그램실', 'other': '기타'
            };
            const docTitle = titleMap[safeId] || safeId;
            const hasTabs = ['행정_매뉴얼', '기술_매뉴얼'].includes(safeId);
            breadcrumbCurrent.textContent = (isVoc ? "시민의 소리 > " : "문서: ") + docTitle + (hasTabs ? ' > ' + DOMPurify.sanitize(facility) : '');
            
            // 🚀 [UI 보강] 검색 결과에서 왔을 경우 하단 버튼 보이기
            if (lastSearchQuery && contentId !== 'admin_dashboard') {
                document.getElementById('reopenSearchBtn').classList.replace('hidden', 'flex');
                document.getElementById('reopenSearchDivider').classList.replace('hidden', 'block');
            }
            let tabsHtml = '';
            if (hasTabs) {
                const facilitiesList = ['공통', '청주수영장', '푸르미스포츠센터', '영운국민체육센터', '복대국민체육센터', '가경국민체육센터', '산남국민체육센터'];
                tabsHtml = '<div class="flex flex-wrap gap-2 mb-6" role="tablist">';
                for(let fac of facilitiesList) {
                    const isActive = (fac === facility);
                    const activeClass = isActive ? 'bg-emerald-600 text-white shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300';
                    tabsHtml += `<button onclick="loadContent('${safeId}', '${fac}')" class="px-4 py-2 rounded-lg text-sm transition-all ${activeClass}">${fac}</button>`;
                }
                tabsHtml += '</div>';
            }
            contentArea.innerHTML = tabsHtml + '<div class="py-20 text-center text-gray-400"><i class="ph ph-spinner-gap animate-spin text-4xl mb-4"></i><p>로딩 중...</p></div>';
            if (safeId === 'admin_dashboard') {
                contentArea.innerHTML = `<div class='w-full h-[800px] rounded-2xl overflow-hidden shadow-lg bg-white'><iframe src='pages/admin_dashboard.html' class='w-full h-full border-0'></iframe></div>`;
                return;
            }
            if (safeId === 'safety') {
                contentArea.innerHTML = `<div class="w-full h-[700px] rounded-lg overflow-hidden border border-gray-200"><embed src="docs/체육시설 안전관리 표준매뉴얼.pdf" type="application/pdf" width="100%" height="100%" /></div>`;
                return;
            }
            try {
                const fetchPath = isVoc 
                    ? `data/voc/${safeId}.md`
                    : (facility === 'system' ? `data/system/${safeId}.md` : (facility === 'data' ? `data/${safeId}.md` : (hasTabs ? `data/facilities/${safeId}_${facility}.md` : `data/facilities/${safeId}.md`)));
                
                const response = await fetch(fetchPath, { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error(`서버 응답 오류 (${response.status}): ${fetchPath} 파일을 찾을 수 없거나 접근할 수 없습니다.`);
                }
                
                const markdownText = await response.text();
                
                // 🚀 [시스템 문의 게시판 전용 파서]
                if (contentId === 'system_inquiry') {
                    const sections = markdownText.split('###');
                    // 첫 번째 섹션(제목 및 안내문) 제외하고 실제 게시물만 처리
                    const postSections = sections.slice(1).filter(s => s.trim().length > 5);
                    
                    let inquiryHtml = `<div class="mb-10">
                        <div class="flex justify-between items-center mb-4">
                            <h1 class="text-3xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                <i class="ph ph-chat-circle-dots text-emerald-500"></i>
                                시스템 문의/요청 <span class="text-sm font-normal text-slate-400 ml-2">(System Inquiry)</span>
                            </h1>
                            <button onclick="openInquiryModal()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl text-sm font-black flex items-center gap-2 hover:bg-emerald-700 transition-all shadow-lg hover:translate-y-[-2px] active:translate-y-0"><i class="ph ph-pencil-line"></i> 문의하기</button>
                        </div>
                        <p class="info-notice-box">
                            <i class="ph ph-info text-emerald-500 text-lg"></i>
                            시스템 이용 중 불편한 점이나 개선 요청사항을 남겨주세요. 관리자가 확인 후 성실히 답변해 드립니다.
                        </p>
                    </div>`;
                    
                    postSections.forEach(card => {
                        const lines = card.split('\n').filter(l => l.trim() !== '');
                        const header = lines[0].trim();
                        
                        // 메타 데이터 추출 및 마스킹 강화
                        const metaLine = lines.find(l => l.includes('작성자')) || '';
                        const dateMatch = metaLine.match(/\d{4}\.\d{2}\.\d{2}/);
                        const displayDate = dateMatch ? dateMatch[0] : '2026.05.16';
                        
                        // 내용 추출 (더 유연하게)
                        let content = "";
                        const contentIdx = lines.findIndex(l => l.includes('내용'));
                        if (contentIdx > -1) {
                            content = lines[contentIdx].replace(/.*내용[:\s*]+/, '').trim();
                        } else {
                            // "내용" 키워드가 없으면 헤더와 메타라인을 제외한 첫 번째 유의미한 줄 사용
                            const filtered = lines.filter(l => !l.startsWith('#') && !l.includes('작성자') && !l.startsWith('>'));
                            if (filtered.length > 0) content = filtered[0];
                        }
                        content = content.replace(/\*|\*\*/g, '').trim();
                        
                        // 답변 추출 (인용구 > 기호 기준)
                        const replyIndex = lines.findIndex(l => l.startsWith('>'));
                        let reply = null;
                        if (replyIndex > -1) {
                            reply = lines.slice(replyIndex)
                                .map(l => l.replace(/^>\s*/, '').replace(/.*관리자 답변\s*/, '').replace(/\*|\*\*/g, ''))
                                .filter(l => l.trim() !== '' && !l.includes('관리자 답변'))
                                .join('<br>');
                        }
                        
                        const statusBadge = header.includes('[처리중]') ? '<span class="badge-processing">처리중</span>' : 
                                            (header.includes('[완료]') ? '<span class="badge-complete">완료</span>' : 
                                            '<span class="badge-received">접수중</span>');
                        const cleanHeader = header.replace(/\[처리중\]|\[완료\]|\[접수중\]/g, '').replace(/\*|\*\*/g, '').trim();

                        inquiryHtml += `
                        <div class="inquiry-card">
                            <div class="inquiry-header">
                                <div class="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">${cleanHeader}</div>
                                <div class="flex items-center gap-3">
                                    ${statusBadge}
                                    <div class="text-[11px] text-slate-400 font-mono tracking-tighter">${displayDate}</div>
                                </div>
                            </div>
                            <div class="inquiry-body">
                                <div class="inquiry-meta">
                                    <span class="flex items-center gap-2"><i class="ph ph-user-focus text-xl text-emerald-500"></i> ${metaLine.replace(/\*|작성자[:\s*]+/g, '').split('|')[0].trim() || '익명'}</span>
                                    <span class="text-slate-100 dark:text-slate-800">|</span>
                                    <span class="flex items-center gap-2"><i class="ph ph-calendar-check text-xl text-emerald-500"></i> ${displayDate}</span>
                                </div>
                                <div class="inquiry-content">${content}</div>
                                ${reply ? `
                                <div class="admin-reply-box">
                                    <div class="admin-reply-header">
                                        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                        <i class="ph ph-chat-dots"></i> 관리자 답변
                                    </div>
                                    <div class="admin-reply-content">${reply}</div>
                                </div>` : `<div class="mt-4 flex justify-end">
                                    <button onclick="openAdminReplyModal(this)" class="text-[11px] font-bold text-slate-400 hover:text-emerald-600 transition-colors flex items-center gap-1.5"><i class="ph ph-chat-centered-dots"></i> 관리자 답변 달기</button>
                                </div>`}
                            </div>
                        </div>`;
                    });
                    
                    inquiryHtml += `<div class="h-32"></div>`; // 하단 플로팅 버튼과 겹침 방지 여백
                    contentArea.innerHTML = inquiryHtml;
                    return;
                }

                const rawHtml = marked.parse(markdownText);
                
                const tempTableDiv = document.createElement('div');
                tempTableDiv.innerHTML = rawHtml;
                
                // 표 셀 병합 엔진 (^)
                tempTableDiv.querySelectorAll('table').forEach(table => {
                    if (isVoc) table.classList.add('voc-table');
                    const rows = Array.from(table.querySelectorAll('tr'));
                    rows.forEach(row => {
                        let vIdx = 0; Array.from(row.cells).forEach(cell => cell.dataset.vcol = vIdx++);
                    });
                    for (let i = rows.length - 1; i > 0; i--) {
                        Array.from(rows[i].cells).forEach(cell => {
                            const txt = cell.textContent.replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
                            if (txt === '^') {
                                const vcol = cell.dataset.vcol;
                                let tIdx = i - 1; let tCell = null;
                                while (tIdx >= 0) {
                                    const cand = Array.from(rows[tIdx].cells).find(c => c.dataset.vcol === vcol);
                                    if (cand) {
                                        const ctxt = cand.textContent.replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
                                        if (ctxt !== '^') { tCell = cand; break; }
                                    }
                                    tIdx--;
                                }
                                if (tCell) {
                                    const span = parseInt(tCell.getAttribute('rowspan') || 1);
                                    tCell.setAttribute('rowspan', span + 1);
                                    tCell.style.verticalAlign = 'middle';
                                    cell.classList.add('to-be-removed');
                                }
                            }
                        });
                    }
                    table.querySelectorAll('.to-be-removed').forEach(td => td.remove());
                });
                
                let safeHtml = DOMPurify.sanitize(tempTableDiv.innerHTML, { ADD_ATTR: ['rowspan', 'colspan', 'style'] });
                
                if (searchQuery && searchQuery.trim().length >= 2) {
                    const regex = new RegExp(`(${searchQuery.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&')})`, 'gi');
                    safeHtml = safeHtml.replace(/(<[^>]+>)|([^<]+)/g, (match, g1, g2) => {
                        if (g1) return g1;
                        return g2.replace(regex, '<mark class="bg-yellow-200 dark:bg-yellow-800 text-gray-900 dark:text-white rounded px-0.5 font-bold search-match">$1</mark>');
                    });
                }

                contentArea.innerHTML = tabsHtml + `
                    <div id="markdown-body" class="prose dark:prose-invert max-w-none prose-emerald lg:prose-lg">
                        ${safeHtml}
                    </div>
                `;

                if (isVoc) {
                    const mdBody = document.getElementById('markdown-body');
                    const mainTitle = mdBody.querySelector('h1');
                    if (mainTitle) {
                        mainTitle.className = 'text-sm font-semibold mb-4 text-emerald-600 dark:text-emerald-400 flex items-center gap-2 border-b pb-2';
                    }

                    const headers = mdBody.querySelectorAll('h2');
                    headers.forEach((h, idx) => {
                        const content = [];
                        let curr = h.nextElementSibling;
                        while (curr && curr.tagName !== 'H2') {
                            content.push(curr.outerHTML);
                            const next = curr.nextElementSibling;
                            curr.remove();
                            curr = next;
                        }
                        
                        // 🚀 [고도화] [시설명] 태그 컬러링 및 제목 정제
                        let hTitle = h.innerHTML;
                        let tagClass = 'tag-default';
                        
                        if (hTitle.includes('[청주수영장]')) {
                            tagClass = 'tag-swimming';
                            hTitle = hTitle.replace('[청주수영장]', `<span class="voc-tag ${tagClass}">청주수영장</span>`);
                        } else if (hTitle.includes('[가경국민체육센터]')) {
                            tagClass = 'tag-gagyeong';
                            hTitle = hTitle.replace('[가경국민체육센터]', `<span class="voc-tag ${tagClass}">가경국민체육센터</span>`);
                        } else if (hTitle.includes('[복대국민체육센터]')) {
                            tagClass = 'tag-bokdae';
                            hTitle = hTitle.replace('[복대국민체육센터]', `<span class="voc-tag ${tagClass}">복대국민체육센터</span>`);
                        } else if (hTitle.includes('[영운국민체육센터]')) {
                            tagClass = 'tag-youngun';
                            hTitle = hTitle.replace('[영운국민체육센터]', `<span class="voc-tag ${tagClass}">영운국민체육센터</span>`);
                        } else if (hTitle.includes('[공통]')) {
                            tagClass = 'tag-common';
                            hTitle = hTitle.replace('[공통]', `<span class="voc-tag ${tagClass}">공통</span>`);
                        } else if (hTitle.match(/\[(.*?)\]/)) {
                            hTitle = hTitle.replace(/\[(.*?)\]/, `<span class="voc-tag ${tagClass}">$1</span>`);
                        }
                        
                        const wrapper = document.createElement('div');
                        wrapper.className = 'mb-2 overflow-hidden';
                        h.className = 'w-full text-left px-0 py-2 bg-transparent hover:text-emerald-600 dark:hover:text-emerald-400 flex justify-between items-center cursor-pointer m-0 text-base font-bold text-gray-800 dark:text-white transition-colors border-b border-gray-100 dark:border-gray-800';
                        h.innerHTML = `<span>${hTitle}</span><i class="ph ph-caret-down transition-transform"></i>`;
                        
                        const body = document.createElement('div');
                        body.className = 'hidden p-6 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800';
                        body.innerHTML = content.join('');
                        
                        h.onclick = () => {
                            body.classList.toggle('hidden');
                            h.querySelector('i').classList.toggle('rotate-180');
                        };
                        
                        // 🚀 [스타일 분리] VOC 표에만 전용 클래스 주입
                        body.querySelectorAll('table').forEach(tbl => tbl.classList.add('voc-table'));
                        
                        h.parentNode.insertBefore(wrapper, h);
                        wrapper.appendChild(h);
                        wrapper.appendChild(body);
                    });
                }

                if (searchQuery) {
                    setTimeout(() => {
                        const firstMatch = document.querySelector('.search-match');
                        if (firstMatch) {
                            firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 300);
                }
            } catch (err) {
                contentArea.innerHTML = tabsHtml + `
                    <div class="text-center py-20 text-gray-500">
                        <i class="ph ph-warning-circle text-5xl mb-4 text-amber-500"></i>
                        <h2 class="text-xl font-bold mb-2 text-gray-800 dark:text-white">문서 로딩 실패</h2>
                        <div class="mt-4 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg text-sm border border-gray-200 dark:border-gray-700 max-w-xl mx-auto">
                            <p class="font-mono text-left break-all text-red-500">${err.message}</p>
                            <p class="mt-2 text-xs text-gray-400 text-left">※ 원인: 서버 미작동, 파일 경로 불일치, 또는 네트워크 연결 오류</p>
                        </div>
                        <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors shadow-lg">페이지 새로고침</button>
                    </div>
                `;
            }
            document.getElementById('mainScrollArea').scrollTop = 0;
        }

        // 🚀 [시스템 문의] 모달 및 등록 로직
        function openInquiryModal() {
            const modal = document.createElement('div');
            modal.id = 'inquiryModal';
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content" id="modalContent">
                    <div class="p-6 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center bg-emerald-50/30 dark:bg-emerald-950/20">
                        <h3 class="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="ph ph-paper-plane-tilt text-emerald-500"></i> 문의 등록
                        </h3>
                        <button onclick="closeInquiryModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors"><i class="ph ph-x text-2xl"></i></button>
                    </div>
                    <form onsubmit="submitInquiry(event)" class="p-8 space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="form-label">카테고리</label>
                                <select id="inquiryCategory" class="form-input">
                                    <option value="시스템">시스템 오류/개선</option>
                                    <option value="매뉴얼">매뉴얼 수정 요청</option>
                                    <option value="기타">기타 문의</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">작성자</label>
                                <input type="text" id="inquiryAuthor" class="form-input" placeholder="성함 또는 센터명" required>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">제목</label>
                            <input type="text" id="inquiryTitle" class="form-input" placeholder="문의 제목을 입력하세요" required>
                        </div>
                        <div>
                            <label class="form-label">문의 내용</label>
                            <textarea id="inquiryContent" class="form-input h-32 resize-none" placeholder="상세 내용을 입력해 주세요. 관리자가 확인 후 답변해 드립니다." required></textarea>
                        </div>
                        <div class="pt-4 flex gap-3">
                            <button type="button" onclick="closeInquiryModal()" class="flex-1 px-6 py-3 rounded-xl border border-gray-200 dark:border-gray-700 text-gray-500 font-bold hover:bg-gray-50 dark:hover:bg-gray-900 transition-all text-sm">취소</button>
                            <button type="submit" class="flex-[2] px-6 py-3 rounded-xl bg-emerald-600 text-white font-black hover:bg-emerald-700 shadow-lg shadow-emerald-200 dark:shadow-none transition-all text-sm flex items-center justify-center gap-2">
                                <i class="ph ph-check-circle"></i> 등록하기
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => document.getElementById('modalContent').classList.add('active'), 10);
        }

        function closeInquiryModal() {
            const content = document.getElementById('modalContent');
            if (content) content.classList.remove('active');
            setTimeout(() => {
                const modal = document.getElementById('inquiryModal');
                if (modal) modal.remove();
            }, 300);
        }

        async function submitInquiry(event) {
            event.preventDefault();
            const category = document.getElementById('inquiryCategory').value;
            const author = document.getElementById('inquiryAuthor').value;
            const title = document.getElementById('inquiryTitle').value;
            const content = document.getElementById('inquiryContent').value;
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');

            // 🚀 시뮬레이션 로직 (실제 DB 연동 전까지 브라우저 상단에 즉시 추가)
            const listArea = document.querySelector('#contentView .h-32').previousElementSibling; // 리스트 마지막 요소 위
            const newCard = document.createElement('div');
            newCard.className = 'inquiry-card border-l-emerald-400';
            newCard.innerHTML = `
                <div class="inquiry-header">
                    <div class="text-xl font-black text-slate-800 dark:text-white flex items-center gap-2">[${category}] ${title}</div>
                    <div class="flex items-center gap-3">
                        <span class="badge-received">접수중</span>
                        <div class="text-[11px] text-slate-400 font-mono tracking-tighter">${today}</div>
                    </div>
                </div>
                <div class="inquiry-body">
                    <div class="inquiry-meta">
                        <span class="flex items-center gap-2"><i class="ph ph-user-focus text-xl text-emerald-500"></i> ${author}</span>
                        <span class="text-slate-100 dark:text-slate-800">|</span>
                        <span class="flex items-center gap-2"><i class="ph ph-calendar-check text-xl text-emerald-500"></i> ${today}</span>
                    </div>
                    <div class="inquiry-content">
                        ${content.replace(/\n/g, '<br>')}
                    </div>
                    <div class="mt-4 flex justify-end">
                        <button onclick="openAdminReplyModal(this)" class="text-[11px] font-bold text-slate-400 hover:text-emerald-600 transition-colors flex items-center gap-1.5"><i class="ph ph-chat-centered-dots"></i> 관리자 답변 달기</button>
                    </div>
                </div>
            `;
            
            // 리스트 최상단(안내박스 아래)에 삽입
            const firstCard = document.querySelector('.inquiry-card');
            if (firstCard) {
                firstCard.parentNode.insertBefore(newCard, firstCard);
            } else {
                document.querySelector('.info-notice-box').parentNode.appendChild(newCard);
            }

            // 스크롤 이동 및 완료 알림
            closeInquiryModal();
            newCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            alert('문의가 정상적으로 등록되었습니다!\n(현재는 시뮬레이션 모드로 작동하며, 실제 파일 저장은 추후 서버 연동 시 지원됩니다.)');
        }

        // 🚀 [관리자 답변] 기능 구현
        // 보안 지침: 평문 노출 방지를 위해 인코딩된 값 사용
        const _A1 = "YWRtaW4xMjM0"; // admin1234
        const _A2 = "NzI1MTEwMDE="; // 72511001

        function openAdminReplyModal(btn) {
            const pass = prompt("관리자 인증이 필요합니다. 비밀번호를 입력하세요:");
            if (pass !== atob(_A1) && pass !== atob(_A2)) {
                alert("인증에 실패했습니다. 관리자 권한이 없습니다.");
                return;
            }

            activeReplyTarget = btn.closest('.inquiry-card');
            const currentTitle = activeReplyTarget.querySelector('.inquiry-header .text-xl').innerText;
            
            const modal = document.createElement('div');
            modal.id = 'adminReplyModal';
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content" id="adminReplyContent">
                    <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-slate-50 dark:bg-slate-900 flex justify-between items-center">
                        <h3 class="text-lg font-black text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="ph ph-shield-check text-blue-500"></i> 관리자 응대 (ID: ${Math.random().toString(36).substr(2, 5).toUpperCase()})
                        </h3>
                        <button onclick="closeAdminReplyModal()" class="text-gray-400 hover:text-gray-600 transition-colors"><i class="ph ph-x text-2xl"></i></button>
                    </div>
                    <div class="p-6 bg-blue-50/30 dark:bg-blue-900/10 border-b border-blue-100 dark:border-blue-900/30">
                        <p class="text-[11px] text-blue-600 font-bold mb-1">문의 대상</p>
                        <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${currentTitle}</p>
                    </div>
                    <form onsubmit="submitAdminReply(event)" class="p-8 space-y-5">
                        <div>
                            <label class="form-label">처리 상태 변경</label>
                            <div class="flex gap-3">
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="replyStatus" value="받음" class="hidden peer">
                                    <div class="py-2 text-center rounded-lg border border-gray-200 dark:border-gray-700 peer-checked:border-blue-500 peer-checked:bg-blue-50 dark:peer-checked:bg-blue-900/20 text-xs font-bold transition-all">접수중</div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="replyStatus" value="처리중" checked class="hidden peer">
                                    <div class="py-2 text-center rounded-lg border border-gray-200 dark:border-gray-700 peer-checked:border-amber-500 peer-checked:bg-amber-50 dark:peer-checked:bg-amber-900/20 text-xs font-bold transition-all">처리중</div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input type="radio" name="replyStatus" value="완료" class="hidden peer">
                                    <div class="py-2 text-center rounded-lg border border-gray-200 dark:border-gray-700 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 dark:peer-checked:bg-emerald-900/20 text-xs font-bold transition-all">처리완료</div>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">답변 내용</label>
                            <textarea id="adminReplyText" class="form-input h-40 resize-none" placeholder="문의에 대한 공식 답변을 작성하세요." required></textarea>
                        </div>
                        <div class="pt-4">
                            <button type="submit" class="w-full px-6 py-4 rounded-xl bg-slate-800 dark:bg-emerald-600 text-white font-black hover:opacity-90 transition-all flex items-center justify-center gap-2 shadow-xl">
                                <i class="ph ph-check-square-offset"></i> 답변 및 상태 저장
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => document.getElementById('adminReplyContent').classList.add('active'), 10);
        }

        function closeAdminReplyModal() {
            const content = document.getElementById('adminReplyContent');
            if (content) content.classList.remove('active');
            setTimeout(() => {
                const modal = document.getElementById('adminReplyModal');
                if (modal) modal.remove();
            }, 300);
        }

        function submitAdminReply(event) {
            event.preventDefault();
            const status = document.querySelector('input[name="replyStatus"]:checked').value;
            const replyText = document.getElementById('adminReplyText').value;

            // 최종 보안 확인
            if (activeReplyTarget) {
                // 1. 상태 배지 업데이트
                const badgeContainer = activeReplyTarget.querySelector('.inquiry-header .flex.items-center.gap-3');
                const oldBadge = badgeContainer.querySelector('span');
                if (oldBadge) oldBadge.remove();
                
                const newBadge = document.createElement('span');
                if (status === '완료') { newBadge.className = 'badge-complete'; newBadge.innerText = '완료'; }
                else if (status === '처리중') { newBadge.className = 'badge-processing'; newBadge.innerText = '처리중'; }
                else { newBadge.className = 'badge-received'; newBadge.innerText = '접수중'; }
                badgeContainer.prepend(newBadge);

                // 2. 답변 박스 추가/업데이트
                let replyBox = activeReplyTarget.querySelector('.admin-reply-box');
                if (!replyBox) {
                    replyBox = document.createElement('div');
                    replyBox.className = 'admin-reply-box';
                    activeReplyTarget.querySelector('.inquiry-body').appendChild(replyBox);
                    // 기존 답변 달기 버튼 제거
                    const replyBtn = activeReplyTarget.querySelector('.mt-4.flex.justify-end');
                    if (replyBtn) replyBtn.remove();
                }
                
                replyBox.innerHTML = `
                    <div class="admin-reply-header">
                        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                        <i class="ph ph-chat-dots"></i> 관리자 답변
                    </div>
                    <div class="admin-reply-content">${replyText.replace(/\n/g, '<br>')}</div>
                `;

                closeAdminReplyModal();
                alert('답변이 등록되고 처리 상태가 변경되었습니다!');
            }
        }

        function showDashboard(isPopState = false) {
            document.getElementById('contentView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            if (!isPopState) { history.pushState({ page: 'dashboard' }, '', window.location.pathname); }
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            breadcrumbNav.classList.remove('flex'); breadcrumbNav.classList.add('hidden');
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.page === 'content') { loadContent(e.state.id, e.state.facility || '공통', true); }
            else { showDashboard(true); }
        });

        let searchIndex = [];
        async function initSearchEngine() {
            try {
                const response = await fetch('data/system/search_index.json');
                if (response.ok) { searchIndex = await response.json(); }
            } catch (e) { console.error('[Search] 인덱스 로드 실패:', e); }
        }
        initSearchEngine();

        let currentSearchIndex = -1;
        let autocompleteIndex = -1;

        // 🚀 [검색] 자동완성 구현
        function handleAutocomplete(query, inputId) {
            const list = document.getElementById('autocompleteList');
            const searchResults = document.getElementById('searchResults');
            
            if (!query.trim() || query.length < 2) {
                list.classList.add('hidden');
                autocompleteIndex = -1;
                if (searchResults) {
                    searchResults.style.setProperty('margin-top', '8px', 'important');
                }
                return;
            }

            const safeQuery = query.toLowerCase();
            const suggestions = searchIndex
                .filter(item => item.title && item.title.toLowerCase().includes(safeQuery))
                .slice(0, 10); // 10개까지 추천하되 5개 이후로는 스크롤 적용

            if (suggestions.length > 0) {
                let html = suggestions.map((item, idx) => {
                    let displayFacility = "";
                    const f = item.facility || "";
                    
                    // 🚀 [보안/가독성] 카테고리-시설명 형식으로 고도화
                    if (f === 'guide') displayFacility = '시설 안내';
                    else if (f === 'data') displayFacility = '시스템';
                    else if (f === 'voc') displayFacility = '시민의 소리';
                    else if (f === 'index') displayFacility = '통합 인덱스';
                    else displayFacility = '매뉴얼';

                    // 시설 정보가 id나 별도 필드에 있을 경우 결합
                    let subInfo = "";
                    if (item.id && item.id.includes('Swimming')) subInfo = "청주수영장";
                    else if (item.id && item.id.includes('bokdae')) subInfo = "복대센터";
                    else if (item.id && item.id.includes('gagyeong')) subInfo = "가경센터";
                    else if (item.id && item.id.includes('youngun')) subInfo = "영운센터";
                    else if (item.id && item.id.includes('purmi')) subInfo = "푸르미센터";
                    else if (item.id && item.id.includes('sannam')) subInfo = "산남센터";

                    const finalLabel = subInfo ? `${displayFacility}-${subInfo}` : displayFacility;

                    const escapedQuery = safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    return `
                    <div class="autocomplete-item" onclick="selectAutocomplete('${item.title}')" data-idx="${idx}">
                        <div class="flex items-center gap-2 overflow-hidden mr-2">
                            <i class="ph ph-magnifying-glass text-emerald-500 text-xs flex-shrink-0"></i>
                            <span class="autocomplete-keyword truncate">${item.title.replace(new RegExp(`(${escapedQuery})`, 'gi'), '<b class="text-emerald-600 dark:text-emerald-400">$1</b>')}</span>
                        </div>
                        <span class="autocomplete-category">${finalLabel}</span>
                    </div>`;
                }).join('');
                list.innerHTML = html;
                list.classList.remove('hidden');
                list.style.display = 'block'; // 명시적으로 보이도록 설정
                
                // 자동완성 활성화 시 상세 결과창을 아래로 110px 밀기
                if (searchResults) {
                    searchResults.style.setProperty('margin-top', '110px', 'important');
                }
            } else {
                list.classList.add('hidden');
                list.style.display = 'none';
                
                // 자동완성 비활성화 시 상세 결과창을 검색창 바로 아래로 8px 밀착
                if (searchResults) {
                    searchResults.style.setProperty('margin-top', '8px', 'important');
                }
            }
        }

        function selectAutocomplete(title) {
            const input = document.getElementById('searchInput');
            input.value = title;
            document.getElementById('autocompleteList').classList.add('hidden');
            
            // 자동완성 선택 후 닫혔으므로 마진을 8px로 복구
            const searchResults = document.getElementById('searchResults');
            if (searchResults) {
                searchResults.style.setProperty('margin-top', '8px', 'important');
            }
            
            // 선택 시 상세 검색 결과창 노출
            performSearch(title, 'searchResults');
        }

        function performSearch(query, resultContainerId) {
            lastSearchQuery = query;
            const container = document.getElementById(resultContainerId);
            if (!query.trim() || query.length < 2) { 
                container.classList.add('hidden'); 
                document.getElementById('reopenSearchBtn').classList.replace('flex', 'hidden');
                document.getElementById('reopenSearchDivider').classList.replace('flex', 'hidden');
                document.getElementById('searchNavigator').classList.replace('flex', 'hidden');
                return; 
            }
            const safeQuery = DOMPurify.sanitize(query.toLowerCase());
            const results = searchIndex.map(item => {
                let score = 0;
                const title = (item.title || '').toLowerCase();
                const content = (item.content || '').toLowerCase();
                if (title.includes(safeQuery)) score += 50;
                if (title.startsWith(safeQuery)) score += 30;
                const matches = (content.match(new RegExp(safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length;
                score += matches * 2;
                return { ...item, score };
            })
            .filter(item => item.score > 0)
            .sort((a, b) => b.score - a.score).slice(0, 10);
            
            currentSearchResults = results; // 네비게이션용 데이터 보관
            
            if (results.length > 0) {
                let html = `<div class="sticky top-0 z-10 px-4 py-2 bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 text-[11px] font-bold text-gray-500 dark:text-gray-400 flex justify-between">
                    <span>검색 결과 ${results.length}건</span>
                    <span class="text-emerald-500">최적 결과순</span>
                </div>`;
                html += results.map(item => {
                    let snippet = item.title;
                    if (item.content) {
                        const idx = item.content.toLowerCase().indexOf(safeQuery);
                        if (idx > -1) {
                            const start = Math.max(0, idx - 25); const end = Math.min(item.content.length, idx + 50);
                            snippet = (start > 0 ? '...' : '') + item.content.substring(start, end).replace(new RegExp(`(${safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<b class="text-emerald-600 dark:text-emerald-400">$1</b>') + (end < item.content.length ? '...' : '');
                        }
                    }
                    return `
                    <button onclick="loadContent('${item.id}', '${item.facility || '공통'}', false, '${safeQuery}'); document.getElementById('${resultContainerId}').classList.add('hidden'); document.getElementById('reopenSearchBtn').classList.replace('hidden', 'flex'); document.getElementById('reopenSearchDivider').classList.replace('hidden', 'block');" 
                        class="w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 transition-all focus:outline-none group">
                        <div class="flex justify-between items-center mb-1">
                            <div class="font-bold text-gray-800 dark:text-gray-200 text-sm group-hover:text-emerald-600 transition-colors">${DOMPurify.sanitize(item.title)}</div>
                            <div class="flex items-center gap-2">
                                <i class="ph ph-arrow-square-out text-emerald-500 opacity-0 group-hover:opacity-100 transition-all transform translate-x-1 group-hover:translate-x-0"></i>
                            </div>
                        </div>
                        <div class="text-[11px] text-gray-500 dark:text-gray-400 line-clamp-2 leading-relaxed mb-1">${DOMPurify.sanitize(snippet, { ALLOWED_TAGS: ['b'], ALLOWED_ATTR: ['class'] })}</div>
                        <div class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold opacity-0 group-hover:opacity-100 transition-all flex items-center gap-1">
                            <i class="ph ph-link"></i> 상세 내용 보기
                        </div>
                    </button>`;
                }).join('');
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="px-4 py-8 text-center text-sm text-gray-500">결과가 없습니다.</div>`;
            }
            container.classList.remove('hidden');
        }

        function reopenSearch() {
            if (lastSearchQuery) {
                const isMobile = window.innerWidth < 640;
                const inputId = isMobile ? 'searchInputMobile' : 'searchInput';
                const resultId = isMobile ? 'searchResultsMobile' : 'searchResults';
                const input = document.getElementById(inputId);
                input.value = lastSearchQuery;
                performSearch(lastSearchQuery, resultId);
                input.focus();
                input.select(); // 기존 텍스트 전체 선택 (편의성)
            }
        }

        function updateSearchNav(currentId) {
            if (currentSearchResults.length > 0) {
                currentSearchIndex = currentSearchResults.findIndex(item => item.id === currentId);
                const nav = document.getElementById('searchNavigator');
                const sticky = document.getElementById('stickyNav');
                
                if (currentSearchIndex > -1) {
                    nav.classList.replace('hidden', 'flex');
                    document.getElementById('prevSearchBtn').disabled = (currentSearchIndex === 0);
                    document.getElementById('nextSearchBtn').disabled = (currentSearchIndex === currentSearchResults.length - 1);
                    
                    // 🚀 [피드백 반영] 네비게이터 활성화 시 하단 바 즉시 노출
                    if (sticky) {
                        sticky.classList.remove('opacity-0', 'invisible', 'translate-y-10');
                        sticky.classList.add('opacity-100', 'visible', 'translate-y-0');
                    }
                } else {
                    nav.classList.replace('flex', 'hidden');
                    // 검색 컨텍스트를 벗어나면 원래의 스크롤 기반 노출 로직이 작동하도록 함
                }
            }
        }

        function navSearchResult(direction) {
            const nextIdx = currentSearchIndex + direction;
            if (nextIdx >= 0 && nextIdx < currentSearchResults.length) {
                const item = currentSearchResults[nextIdx];
                loadContent(item.id, item.facility || '공통', false, lastSearchQuery);
            }
        }

        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            handleAutocomplete(e.target.value, 'searchInput');
            performSearch(e.target.value, 'searchResults');
        });
        document.getElementById('searchInputMobile')?.addEventListener('input', (e) => performSearch(e.target.value, 'searchResultsMobile'));
        
        // 🚀 [검색] 키보드 네비게이션 (자동완성)
        document.getElementById('searchInput')?.addEventListener('keydown', (e) => {
            const list = document.getElementById('autocompleteList');
            const items = list.querySelectorAll('.autocomplete-item');
            
            if (list.classList.contains('hidden')) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                autocompleteIndex = (autocompleteIndex + 1) % items.length;
                updateAutocompleteSelection(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                autocompleteIndex = (autocompleteIndex - 1 + items.length) % items.length;
                updateAutocompleteSelection(items);
            } else if (e.key === 'Enter' && autocompleteIndex > -1) {
                e.preventDefault();
                items[autocompleteIndex].click();
            } else if (e.key === 'Escape') {
                list.classList.add('hidden');
            }
        });

        function updateAutocompleteSelection(items) {
            items.forEach((item, idx) => {
                if (idx === autocompleteIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }
        
        // 🚀 [사용자 피드백 반영] 검색창 클릭 시 즉시 결과 노출
        const inputs = ['searchInput', 'searchInputMobile'];
        inputs.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('focus', (e) => {
                    if (e.target.value.length >= 2) {
                        const resultId = id === 'searchInput' ? 'searchResults' : 'searchResultsMobile';
                        performSearch(e.target.value, resultId);
                    }
                });
                el.addEventListener('click', (e) => {
                    if (e.target.value.length >= 2) {
                        const resultId = id === 'searchInput' ? 'searchResults' : 'searchResultsMobile';
                        performSearch(e.target.value, resultId);
                    }
                });
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchInputMobile') && !e.target.closest('#reopenSearchBtn')) {
                document.getElementById('searchResults')?.classList.add('hidden');
                document.getElementById('searchResultsMobile')?.classList.add('hidden');
            }
        });
        window.onload = () => {
            const facilityMenu = document.getElementById('facility-menu');
            if(facilityMenu) facilityMenu.style.maxHeight = facilityMenu.scrollHeight + 'px';

            // 🚀 [지능형 초기 라우팅] 주소창의 파라미터(?doc=...&facility=...)를 분석하여 자동 로드
            const params = new URLSearchParams(window.location.search);
            const docId = params.get('doc');
            const facility = params.get('facility') || '공통';

            if (docId) {
                console.log(`[Router] 자동 로드 실행: ${docId} (${facility})`);
                loadContent(docId, facility, true);
            }
        };
    </script>
</body>
</html>
