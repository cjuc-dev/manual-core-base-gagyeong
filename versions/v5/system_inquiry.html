<div class="p-4 sm:p-6 animate-fade-in">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-gray-700/50 pb-6 gap-4">
        <div>
            <h2 class="text-xl sm:text-3xl font-bold text-emerald-400 flex items-center gap-2 sm:gap-3">
                시스템 문의/요청 <span class="text-gray-500 text-sm sm:text-lg font-normal whitespace-nowrap">(System Inquiry)</span>
            </h2>
            <p class="text-gray-400 mt-2 text-sm">시스템 이용 중 불편한 점이나 개선 요청사항을 남겨주세요.</p>
        </div>
        <button onclick="openWriteForm()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-all shadow-lg shadow-emerald-900/20 flex items-center gap-2 font-medium group w-full sm:w-auto justify-center">
            <i data-lucide="pen-tool" class="w-4 h-4 group-hover:scale-110 transition-transform"></i> 문의하기
        </button>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-sm shadow-2xl transform transition-all scale-100">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i data-lucide="shield-alert" class="w-5 h-5 text-emerald-400"></i> 관리자 인증
            </h3>
            <p class="text-gray-400 text-sm mb-4">관리자 권한(삭제/답변/상태변경)을 위해 비밀번호를 입력하세요.</p>
            <input type="password" id="adminPassword" placeholder="비밀번호 입력" class="w-full bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-2 text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition mb-4" onkeypress="handlePasswordEnter(event)">
            <div class="flex justify-end gap-3">
                <button onclick="closePasswordModal()" class="px-4 py-2 text-gray-400 hover:text-white transition">취소</button>
                <button onclick="checkAdminPassword()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium shadow-lg shadow-emerald-900/20 transition">확인</button>
            </div>
        </div>
    </div>

    <!-- Write Form -->
    <div id="writeForm" class="hidden mb-8 bg-gray-800/50 p-6 rounded-xl border border-gray-700 backdrop-blur-sm shadow-xl transition-all duration-300">
        <h3 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
            <i data-lucide="pen-tool" class="w-4 h-4 text-emerald-400"></i> 문의 작성
        </h3>
        <input type="hidden" id="editDocId">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">작성자 (Author)</label>
                <input type="text" id="inquiryAuthor" placeholder="이름을 입력하세요" class="w-full bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-2 text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">시설 (Facility)</label>
                <select id="inquiryFacility" class="w-full bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-2 text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition appearance-none">
                    <option value="" disabled selected>시설을 선택하세요</option>
                    <option value="청주수영장">청주수영장</option>
                    <option value="푸르미스포츠센터">푸르미스포츠센터</option>
                    <option value="영운국민체육센터">영운국민체육센터</option>
                    <option value="복대국민체육센터">복대국민체육센터</option>
                    <option value="가경국민체육센터">가경국민체육센터</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">분야 (Category)</label>
            <select id="inquiryCategory" class="w-full bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-2 text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition appearance-none">
                <option value="" disabled selected>분야를 선택하세요</option>
                <option value="시스템">시스템 (System)</option>
                <option value="매뉴얼">매뉴얼 (Manual)</option>
                <option value="기타">기타 (Other)</option>
            </select>
        </div>
        
        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">문의 내용</label>
            <textarea id="inquiryContent" placeholder="문의하실 내용을 상세히 적어주세요." class="w-full h-48 bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-2 text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition resize-none font-mono text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3">
            <button onclick="closeWriteForm()" class="px-4 py-2 text-gray-400 hover:text-white transition">취소</button>
            <button onclick="submitInquiry()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium shadow-lg shadow-emerald-900/20 transition">등록하기</button>
        </div>
    </div>

    <!-- List Container -->
    <div id="inquiryList" class="space-y-4">
        <!-- Firebase Data will be loaded here -->
    </div>
</div>

<script>
{
    // Block scope to prevent global variable conflicts
    let pendingAction = null;
    let targetItemId = null; // For unlocking specific item admin controls

    // Cleanup previous listeners
    const unsubscribes = [
        'vocSwimmingUnsubscribe',
        'vocGymUnsubscribe',
        'vocProgramUnsubscribe',
        'vocOtherUnsubscribe',
        'updateHistoryUnsubscribe',
        'systemInquiryUnsubscribe'
    ];

    unsubscribes.forEach(name => {
        if (window[name]) {
            console.log(`Unsubscribing from ${name}`);
            window[name]();
            window[name] = null;
        }
    });

    // --- Modal Logic ---
    window.openPasswordModal = function(actionCallback, itemId = null) {
        pendingAction = actionCallback;
        targetItemId = itemId;
        document.getElementById('passwordModal').classList.remove('hidden');
        document.getElementById('adminPassword').value = '';
        document.getElementById('adminPassword').focus();
    };

    window.closePasswordModal = function() {
        document.getElementById('passwordModal').classList.add('hidden');
        pendingAction = null;
        targetItemId = null;
    };

    window.handlePasswordEnter = function(event) {
        if (event.key === 'Enter') checkAdminPassword();
    };

    window.checkAdminPassword = function() {
        const password = document.getElementById('adminPassword').value;
        if (password === 'admin') {
            const currentAction = pendingAction;
            const currentItemId = targetItemId;
            
            closePasswordModal();
            
            if (currentAction) {
                currentAction();
            } else if (currentItemId) {
                // Unlock admin controls for specific item
                unlockAdminControls(currentItemId);
            }
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminPassword').focus();
        }
    };

    function unlockAdminControls(id) {
        const adminSection = document.getElementById(`admin-section-${id}`);
        if (adminSection) {
            adminSection.classList.remove('hidden');
            adminSection.classList.add('animate-fade-in');
        }
    }

    // --- Write Form Logic ---
    window.openWriteForm = function(docId = null) {
        const form = document.getElementById('writeForm');
        form.classList.remove('hidden');
        
        if (!docId) {
            // New Entry
            document.getElementById('editDocId').value = '';
            document.getElementById('inquiryAuthor').value = '';
            document.getElementById('inquiryFacility').value = ''; // Default to placeholder
            document.getElementById('inquiryCategory').value = ''; // Default to placeholder
            document.getElementById('inquiryContent').value = '';
            document.querySelector('#writeForm h3').innerHTML = '<i data-lucide="pen-tool" class="w-4 h-4 text-emerald-400"></i> 문의 작성';
        }
        document.getElementById('inquiryAuthor').focus();
    };

    window.closeWriteForm = function() {
        document.getElementById('writeForm').classList.add('hidden');
    };

    window.submitInquiry = function() {
        if (!window.db) {
            alert('Firebase가 초기화되지 않았습니다.');
            return;
        }

        const docId = document.getElementById('editDocId').value;
        const author = document.getElementById('inquiryAuthor').value.trim();
        const facility = document.getElementById('inquiryFacility').value;
        const category = document.getElementById('inquiryCategory').value;
        const content = document.getElementById('inquiryContent').value;

        if (!author || !content) {
            alert('작성자와 내용을 모두 입력해주세요.');
            return;
        }
        if (!facility) {
            alert('시설을 선택해주세요.');
            return;
        }
        if (!category) {
            alert('분야를 선택해주세요.');
            return;
        }

        const data = {
            author: author,
            facility: facility,
            category: category,
            content: content,
            status: '접수 중', // Default status
            timestamp: new Date()
        };

        if (docId) {
            // Update (Only updates content fields, preserves status/reply)
            window.db.collection('system_inquiry').doc(docId).update({
                author: author,
                facility: facility,
                category: category,
                content: content
            }).then(() => {
                alert('수정되었습니다.');
                closeWriteForm();
            }).catch(err => alert('오류 발생: ' + err.message));
        } else {
            // Create
            window.db.collection('system_inquiry').add(data)
            .then(() => {
                alert('등록되었습니다.');
                closeWriteForm();
            }).catch(err => alert('오류 발생: ' + err.message));
        }
    };

    // --- Actions ---
    // Public Edit
    window.editInquiry = function(id, author, facility, category, content) {
        openWriteForm(id);
        document.getElementById('editDocId').value = id;
        document.getElementById('inquiryAuthor').value = author;
        document.getElementById('inquiryFacility').value = facility;
        document.getElementById('inquiryCategory').value = category;
        document.getElementById('inquiryContent').value = content;
        document.querySelector('#writeForm h3').innerHTML = '<i data-lucide="edit" class="w-4 h-4 text-emerald-400"></i> 문의 수정';
    };

    // Admin Auth Trigger
    window.triggerAdminAuth = function(id) {
        openPasswordModal(null, id);
    };

    // Admin Actions (Protected by UI visibility, but double check not strictly needed as UI is hidden)
    window.deleteInquiry = function(id) {
        if (confirm('정말로 삭제하시겠습니까?')) {
            window.db.collection('system_inquiry').doc(id).delete()
            .then(() => alert('삭제되었습니다.'))
            .catch(err => alert('오류 발생: ' + err.message));
        }
    };

    window.updateStatus = function(id, newStatus) {
        window.db.collection('system_inquiry').doc(id).update({ status: newStatus })
        .then(() => console.log('Status updated'))
        .catch(err => alert('상태 변경 오류: ' + err.message));
    };

    window.saveReply = function(id) {
        const replyContent = document.getElementById(`reply-${id}`).value;
        window.db.collection('system_inquiry').doc(id).update({ 
            adminReply: replyContent,
            replyTimestamp: new Date()
        })
        .then(() => alert('답변이 저장되었습니다.'))
        .catch(err => alert('답변 저장 오류: ' + err.message));
    };

    // --- Rendering ---
    function getStatusBadge(status) {
        const styles = {
            '접수 중': 'bg-gray-700 text-gray-300 border-gray-600',
            '처리중': 'bg-orange-900/30 text-orange-400 border-orange-500/30',
            '완료': 'bg-emerald-900/30 text-emerald-400 border-emerald-500/30'
        };
        const style = styles[status] || styles['접수 중'];
        return `<span class="px-2 py-1 rounded text-xs border ${style}">${status}</span>`;
    }

    function createInquiryItemHtml(id, data) {
        const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString() : '';
        const reply = data.adminReply || '';
        const hasReply = !!reply;
        
        return `
            <div class="bg-gray-800/40 rounded-xl border border-gray-700/50 overflow-hidden animate-fade-in-up hover:border-emerald-500/30 transition-colors">
                <div class="p-5">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            ${getStatusBadge(data.status)}
                            <span class="text-emerald-400 font-bold text-sm">[${data.category}]</span>
                            <span class="text-gray-400 text-xs">${data.facility}</span>
                        </div>
                        <span class="text-gray-500 text-xs">${date}</span>
                    </div>
                    
                    <div class="mb-4">
                        <p class="text-gray-300 whitespace-pre-wrap leading-relaxed">${data.content}</p>
                    </div>
                    
                    <!-- Admin Reply Display (Visible to all if exists) -->
                    ${hasReply ? `
                    <div class="mb-4 p-4 bg-indigo-900/20 border border-indigo-500/30 rounded-lg">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="message-square" class="w-4 h-4 text-indigo-400"></i>
                            <span class="text-sm font-bold text-indigo-300">관리자 답변</span>
                        </div>
                        <p class="text-gray-300 text-sm whitespace-pre-wrap">${reply}</p>
                    </div>
                    ` : ''}

                    <div class="flex justify-between items-center border-t border-gray-700/50 pt-3 mt-3">
                        <span class="text-gray-500 text-xs flex items-center gap-1">
                            <i data-lucide="user" class="w-3 h-3"></i> ${data.author}
                        </span>
                        <div class="flex gap-2">
                            <!-- Public Edit -->
                            <button onclick="editInquiry('${id}', '${data.author}', '${data.facility}', '${data.category}', \`${data.content.replace(/`/g, '\\`')}\`)" class="text-xs px-3 py-1.5 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 transition">수정</button>
                            <!-- Admin Trigger -->
                            <button onclick="triggerAdminAuth('${id}')" class="text-xs px-2 py-1.5 rounded bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-emerald-400 transition border border-gray-600" title="관리자 메뉴">
                                <i data-lucide="shield" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Admin Section (Hidden by default, revealed via password) -->
                    <div id="admin-section-${id}" class="hidden mt-4 pt-4 border-t border-gray-700/30 bg-gray-900/30 -mx-5 -mb-5 p-5">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2">
                                <i data-lucide="settings" class="w-4 h-4 text-emerald-400"></i>
                                <span class="text-sm font-semibold text-gray-300">관리자 제어</span>
                            </div>
                            <button onclick="deleteInquiry('${id}')" class="text-xs px-3 py-1.5 rounded bg-red-900/30 hover:bg-red-900/50 text-red-400 transition border border-red-900/50">삭제</button>
                        </div>
                        
                        <!-- Status Control -->
                        <div class="flex gap-2 mb-3">
                            <button onclick="updateStatus('${id}', '접수 중')" class="px-2 py-1 text-xs rounded border border-gray-600 ${data.status === '접수 중' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-white'}">접수 중</button>
                            <button onclick="updateStatus('${id}', '처리중')" class="px-2 py-1 text-xs rounded border border-orange-500/30 ${data.status === '처리중' ? 'bg-orange-900/50 text-orange-400' : 'text-gray-500 hover:text-orange-400'}">처리중</button>
                            <button onclick="updateStatus('${id}', '완료')" class="px-2 py-1 text-xs rounded border border-emerald-500/30 ${data.status === '완료' ? 'bg-emerald-900/50 text-emerald-400' : 'text-gray-500 hover:text-emerald-400'}">완료</button>
                        </div>

                        <textarea id="reply-${id}" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white mb-2" placeholder="답변을 입력하세요...">${reply}</textarea>
                        <div class="flex justify-end">
                            <button onclick="saveReply('${id}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded transition">답변 저장</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // --- Load Data ---
    function loadInquiries() {
        if (!window.db) return;

        window.systemInquiryUnsubscribe = window.db.collection('system_inquiry').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            const list = document.getElementById('inquiryList');
            list.innerHTML = '';
            
            snapshot.docs.forEach(doc => {
                const itemHtml = createInquiryItemHtml(doc.id, doc.data());
                list.insertAdjacentHTML('beforeend', itemHtml);
            });
            lucide.createIcons();
        });
    }

    loadInquiries();
    lucide.createIcons();
}
</script>
