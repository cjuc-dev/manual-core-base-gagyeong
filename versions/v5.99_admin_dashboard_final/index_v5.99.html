        <div id="searchNavigator" class="hidden items-center">
            <button onclick="navSearchResult(-1)" id="prevSearchBtn" 
                class="flex items-center gap-1.5 px-3 py-2 text-xs font-bold text-gray-500 hover:text-amber-600 dark:hover:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/30 rounded-lg transition-all disabled:opacity-30 disabled:pointer-events-none group">

    <script>


        document.getElementById('searchInput')?.addEventListener('input', (e) => {
            handleAutocomplete(e.target.value, 'searchInput');
            performSearch(e.target.value, 'searchResults');
        });
        document.getElementById('searchInputMobile')?.addEventListener('input', (e) => {
            handleAutocomplete(e.target.value, 'searchInputMobile');
            performSearch(e.target.value, 'searchResultsMobile');
        });
        
        // 🚀 [검색] 키보드 네비게이션 (자동완성)
        const setupKeydownAutocomplete = (inputId, listId) => {
            document.getElementById(inputId)?.addEventListener('keydown', (e) => {
                const list = document.getElementById(listId);
                const items = list.querySelectorAll('.autocomplete-item');
                
                if (list.classList.contains('hidden')) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    autocompleteIndex = (autocompleteIndex + 1) % items.length;
                    updateAutocompleteSelection(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    autocompleteIndex = (autocompleteIndex - 1 + items.length) % items.length;
                    updateAutocompleteSelection(items);
                } else if (e.key === 'Enter' && autocompleteIndex > -1) {
                    e.preventDefault();
                    items[autocompleteIndex].click();
                } else if (e.key === 'Escape') {
                    list.classList.add('hidden');
                }
            });
        };
        setupKeydownAutocomplete('searchInput', 'autocompleteList');
        setupKeydownAutocomplete('searchInputMobile', 'autocompleteListMobile');

        function updateAutocompleteSelection(items) {
            items.forEach((item, idx) => {
                if (idx === autocompleteIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }
        
        // 🚀 [사용자 피드백 반영] 검색창 클릭 시 즉시 결과 노출
        const inputs = ['searchInput', 'searchInputMobile'];
        inputs.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.addEventListener('focus', (e) => {
                    if (e.target.value.length >= 2) {
                        const resultId = id === 'searchInput' ? 'searchResults' : 'searchResultsMobile';
                        handleAutocomplete(e.target.value, id);
                        performSearch(e.target.value, resultId);
                    }
                });
                el.addEventListener('click', (e) => {
                    if (e.target.value.length >= 2) {
                        const resultId = id === 'searchInput' ? 'searchResults' : 'searchResultsMobile';
                        handleAutocomplete(e.target.value, id);
                        performSearch(e.target.value, resultId);
                    }
                });
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchInputMobile') && !e.target.closest('#reopenSearchBtn')) {
                document.getElementById('searchResults')?.classList.add('hidden');
                document.getElementById('searchResultsMobile')?.classList.add('hidden');
                document.getElementById('autocompleteList')?.classList.add('hidden');
                document.getElementById('autocompleteListMobile')?.classList.add('hidden');
            }
        });
        window.onload = () => {
            // 🚀 [지능형 초기 라우팅] 주소창의 파라미터(?doc=...&facility=...&sub=...)를 분석하여 자동 로드
            const params = new URLSearchParams(window.location.search);
            const docId = params.get('doc');
            const facility = params.get('facility') || '공통';
            const sub = params.get('sub');

            if (docId) {
                console.log(`[Router] 자동 로드 실행: ${docId} (${facility}) -> ${sub}`);
                window.loadContent(docId, facility, sub, true);
            }
        };

        // 🚀 [SPA 히스토리 동기화] 브라우저 뒤로가기/앞으로가기 시 라우팅 무결성 보장
        window.onpopstate = function(event) {
            if (event.state && event.state.page === 'content') {
                window.loadContent(event.state.id, event.state.facility, event.state.sub, true);
            } else {
                // 대시보드로 복귀
                document.getElementById('contentView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
            }
        };
    </script>
