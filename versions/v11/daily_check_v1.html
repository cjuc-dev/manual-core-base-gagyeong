<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체육시설 맞춤형 집계기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* 숫자 조절 버튼 스타일 */
        .control-btn {
            width: 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .control-btn:hover { background-color: rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4">

    <div class="max-w-6xl mx-auto">
        <header class="mb-6 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-slate-900"><i class="fas fa-edit text-blue-600 mr-2"></i>이용객 수기 집계판</h1>
                <p class="text-xs text-slate-500 mt-1">탁구 5면 / 배드민턴 2면 (인원수 조절 가능)</p>
            </div>
            <button onclick="resetAll()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-lg shadow-sm text-sm font-bold border border-red-200 transition">
                <i class="fas fa-redo-alt mr-1"></i> 전체 초기화
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-8 bg-white p-4 md:p-6 rounded-xl shadow-lg border border-slate-200">
                <div class="flex space-x-2 mb-6 bg-slate-100 p-1 rounded-lg">
                    <button onclick="changeSport('table')" id="tab-table" class="flex-1 py-2 rounded-md text-sm font-bold shadow-sm transition bg-white text-blue-600">
                        🏓 탁구 (5코트)
                    </button>
                    <button onclick="changeSport('badminton')" id="tab-badminton" class="flex-1 py-2 rounded-md text-sm font-bold text-slate-500 hover:bg-white hover:shadow-sm transition">
                        🏸 배드민턴 (2코트)
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-center text-sm border-collapse">
                        <thead>
                            <tr id="gridHeader" class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                </tr>
                        </thead>
                        <tbody id="gridBody">
                            </tbody>
                    </table>
                </div>
                <div class="mt-4 text-xs text-slate-400 flex justify-end items-center">
                    <i class="fas fa-mouse-pointer mr-1"></i> 빈 곳 클릭 시 2명 → [+], [-]로 인원 조절
                </div>
            </div>

            <div class="lg:col-span-4 space-y-4">
                <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-600 sticky top-4">
                    <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center justify-between">
                        <span>📊 집계 결과</span>
                        <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-1 rounded">엑셀 입력용</span>
                    </h2>
                    
                    <div class="space-y-3">
                        <div class="bg-orange-50 p-4 rounded-lg border border-orange-100 flex justify-between items-center">
                            <div>
                                <span class="block text-xs font-bold text-orange-400 mb-1">☀️ 오전 (06~12시)</span>
                                <span class="text-lg font-bold text-orange-900"><span id="amPeople">0</span>명</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-xs text-orange-400 mb-1">코트 사용</span>
                                <span class="text-lg font-bold text-orange-900"><span id="amCourts">0</span>면</span>
                            </div>
                        </div>

                        <div class="bg-green-50 p-4 rounded-lg border border-green-100 flex justify-between items-center">
                            <div>
                                <span class="block text-xs font-bold text-green-500 mb-1">⛅ 오후 (12~18시)</span>
                                <span class="text-lg font-bold text-green-900"><span id="pmPeople">0</span>명</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-xs text-green-500 mb-1">코트 사용</span>
                                <span class="text-lg font-bold text-green-900"><span id="pmCourts">0</span>면</span>
                            </div>
                        </div>

                        <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 flex justify-between items-center">
                            <div>
                                <span class="block text-xs font-bold text-indigo-400 mb-1">🌙 야간 (18~22시)</span>
                                <span class="text-lg font-bold text-indigo-900"><span id="nightPeople">0</span>명</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-xs text-indigo-400 mb-1">코트 사용</span>
                                <span class="text-lg font-bold text-indigo-900"><span id="nightCourts">0</span>면</span>
                            </div>
                        </div>

                        <div class="pt-4 mt-2 border-t border-dashed border-slate-300 flex justify-between items-center">
                            <span class="font-bold text-slate-600">일일 총계</span>
                            <span class="text-xl font-extrabold text-blue-600"><span id="totalPeople">0</span>명 <span class="text-sm font-normal text-slate-400">/</span> <span id="totalCourts">0</span>면</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 설정 데이터 (사용자 요청 반영: 탁구 5개, 배드민턴 2개)
        const config = {
            table: { courts: 5, prefix: '탁구', defaultStart: 2 },
            badminton: { courts: 2, prefix: '배드민턴', defaultStart: 2 }
        };

        const timeSlots = [
            { label: '06:00', type: 'am' }, { label: '08:00', type: 'am' }, { label: '10:00', type: 'am' },
            { label: '12:00', type: 'pm' }, { label: '14:00', type: 'pm' }, { label: '16:00', type: 'pm' },
            { label: '18:00', type: 'night' }, { label: '20:00', type: 'night' }
        ];

        let currentSport = 'table';
        let cellData = {}; // 형식: { "0-0": 2, "0-1": 4 } -> "시간-코트": 인원수

        function changeSport(sport) {
            currentSport = sport;
            // 탭 스타일 변경
            document.getElementById('tab-table').className = sport === 'table' ? 
                'flex-1 py-2 rounded-md text-sm font-bold shadow-sm transition bg-white text-blue-600' : 
                'flex-1 py-2 rounded-md text-sm font-bold text-slate-500 hover:bg-white hover:shadow-sm transition';
            
            document.getElementById('tab-badminton').className = sport === 'badminton' ? 
                'flex-1 py-2 rounded-md text-sm font-bold shadow-sm transition bg-white text-green-600' : 
                'flex-1 py-2 rounded-md text-sm font-bold text-slate-500 hover:bg-white hover:shadow-sm transition';

            cellData = {}; // 종목 변경 시 데이터 초기화
            renderGrid();
        }

        function renderGrid() {
            const settings = config[currentSport];
            const thead = document.getElementById('gridHeader');
            const tbody = document.getElementById('gridBody');
            
            // 1. 헤더 생성
            let headerHTML = '<th class="p-3 border-r border-slate-200 bg-slate-50 w-20">시간</th>';
            for(let i=1; i<=settings.courts; i++) {
                headerHTML += `<th class="p-3 border-r border-slate-200 font-medium">${i}코트</th>`;
            }
            headerHTML += '<th class="p-3 text-xs text-blue-600 w-16">전체</th>';
            thead.innerHTML = headerHTML;

            // 2. 본문 생성
            tbody.innerHTML = '';
            updateStats();

            timeSlots.forEach((slot, tIdx) => {
                let tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-slate-50';
                
                // 시간 라벨 스타일
                let timeColor = slot.type === 'am' ? 'text-orange-600' : (slot.type === 'pm' ? 'text-green-600' : 'text-indigo-600');
                tr.innerHTML = `<td class="py-2 border-r border-slate-200 font-bold text-xs ${timeColor}">${slot.label}</td>`;

                // 코트 버튼들
                for(let cIdx=0; cIdx < settings.courts; cIdx++) {
                    const cellId = `${tIdx}-${cIdx}`;
                    const count = cellData[cellId] || 0;
                    
                    tr.innerHTML += `<td class="p-1 border-r border-slate-200 h-12 align-middle">${renderCellContent(cellId, count)}</td>`;
                }

                // 행 전체 선택 버튼
                tr.innerHTML += `
                    <td class="p-1 text-center">
                        <button onclick="toggleRow(${tIdx})" class="text-xs text-slate-400 hover:text-blue-600 font-bold px-2 py-1 rounded hover:bg-blue-50 transition">
                            <i class="fas fa-check-double"></i>
                        </button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        // 셀 내부 HTML 생성 (0명일 때 vs 인원 있을 때)
        function renderCellContent(id, count) {
            if (count === 0) {
                // 빈 곳 버튼
                return `<button onclick="adjustCount('${id}', 2)" class="w-full h-10 rounded bg-slate-100 text-slate-400 text-xs hover:bg-slate-200 transition">빈 곳</button>`;
            } else {
                // 인원 조절 컨트롤 (+/-)
                return `
                    <div class="flex items-center justify-between w-full h-10 bg-blue-600 rounded text-white overflow-hidden shadow-md">
                        <button onclick="adjustCount('${id}', -1)" class="control-btn hover:bg-blue-700 text-xs font-bold w-8">-</button>
                        <span class="font-bold text-sm flex-1">${count}</span>
                        <button onclick="adjustCount('${id}', 1)" class="control-btn hover:bg-blue-700 text-xs font-bold w-8">+</button>
                    </div>
                `;
            }
        }

        // 인원 조절 함수
        function adjustCount(id, delta) {
            let current = cellData[id] || 0;
            
            if (current === 0 && delta === 2) {
                // 빈 곳 클릭 시 초기값 설정
                cellData[id] = 2;
            } else {
                let nextVal = current + delta;
                if (nextVal <= 0) {
                    delete cellData[id]; // 0 이하 되면 데이터 삭제 (빈 곳 처리)
                } else {
                    cellData[id] = nextVal;
                }
            }
            
            // 해당 셀만 리렌더링 (전체 리렌더링보다 효율적이나 코드가 복잡해지므로 여기선 전체 리렌더링 사용)
            // 간단하게 전체 다시 그리기
            renderGrid(); 
        }

        // 행 전체 선택/해제
        function toggleRow(tIdx) {
            const settings = config[currentSport];
            let allActive = true;
            
            // 해당 시간대 모든 코트가 차있는지 확인
            for(let i=0; i<settings.courts; i++) {
                if(!cellData[`${tIdx}-${i}`]) {
                    allActive = false;
                    break;
                }
            }

            for(let i=0; i<settings.courts; i++) {
                const id = `${tIdx}-${i}`;
                if(allActive) {
                    delete cellData[id]; // 모두 차있으면 -> 전체 비우기
                } else {
                    if(!cellData[id]) cellData[id] = 2; // 비어있는 곳만 -> 2명으로 채우기
                }
            }
            renderGrid();
        }

        function updateStats() {
            let stats = {
                am: { people: 0, courts: 0 },
                pm: { people: 0, courts: 0 },
                night: { people: 0, courts: 0 }
            };

            for (const [key, count] of Object.entries(cellData)) {
                const [tIdx, cIdx] = key.split('-').map(Number);
                const type = timeSlots[tIdx].type;
                
                stats[type].courts += 1;
                stats[type].people += count;
            }

            // 화면 업데이트
            document.getElementById('amPeople').innerText = stats.am.people;
            document.getElementById('amCourts').innerText = stats.am.courts;
            
            document.getElementById('pmPeople').innerText = stats.pm.people;
            document.getElementById('pmCourts').innerText = stats.pm.courts;
            
            document.getElementById('nightPeople').innerText = stats.night.people;
            document.getElementById('nightCourts').innerText = stats.night.courts;

            document.getElementById('totalPeople').innerText = stats.am.people + stats.pm.people + stats.night.people;
            document.getElementById('totalCourts').innerText = stats.am.courts + stats.pm.courts + stats.night.courts;
        }

        function resetAll() {
            if(confirm('모든 입력 내용을 초기화하시겠습니까?')) {
                cellData = {};
                renderGrid();
            }
        }

        // 초기 실행
        renderGrid();
    </script>
</body>
</html>
