<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그리드 아이콘 분리 도구</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-area.dragover {
            background: #e8e9ff;
            border-color: #764ba2;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .grid-settings {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .grid-settings.active {
            display: block;
        }
        
        .grid-settings label {
            display: inline-block;
            margin-right: 15px;
            font-weight: bold;
            color: #667eea;
        }
        
        .grid-settings input {
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 5px;
            width: 80px;
            font-size: 16px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
            display: block;
            margin: 20px auto;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #preview {
            text-align: center;
            margin: 30px 0;
        }
        
        #preview img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .icon-card {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .icon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .icon-card img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .icon-card h4 {
            color: #667eea;
            margin: 10px 0 5px 0;
            font-size: 14px;
        }
        
        .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin: 5px;
            transition: all 0.2s;
            width: 100%;
        }
        
        .download-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        
        .download-all-btn {
            background: #FF6B6B;
            color: white;
            padding: 15px 40px;
            margin: 20px auto;
        }
        
        .download-all-btn:hover {
            background: #FF5252;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 그리드 아이콘 분리 도구</h1>
        
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <h2>📁 이미지를 드래그 & 드롭하거나 클릭하여 선택하세요</h2>
            <p>PNG, JPG, JPEG 형식 지원</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="grid-settings" id="gridSettings">
            <h3>그리드 설정</h3>
            <label>가로 개수 (Columns):</label>
            <input type="number" id="cols" value="3" min="1" max="20">
            
            <label>세로 개수 (Rows):</label>
            <input type="number" id="rows" value="4" min="1" max="20">
        </div>
        
        <div id="preview"></div>
        
        <button id="splitBtn" onclick="splitImage()" disabled>✂️ 이미지 분리하기</button>
        
        <div id="status"></div>
        <div id="results" class="results"></div>
        
        <button id="downloadAllBtn" class="download-all-btn" onclick="downloadAll()" style="display: none;">📦 모두 다운로드</button>
    </div>

    <script>
        let uploadedImage = null;
        let canvasArray = [];
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const splitBtn = document.getElementById('splitBtn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const gridSettings = document.getElementById('gridSettings');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        // 드래그 앤 드롭 이벤트
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    preview.innerHTML = `<h3>업로드된 이미지</h3><img src="${e.target.result}" alt="Uploaded Image">`;
                    splitBtn.disabled = false;
                    gridSettings.classList.add('active');
                    status.innerHTML = '<div class="status info">✅ 이미지가 로드되었습니다. 그리드 설정을 확인하고 "이미지 분리하기" 버튼을 클릭하세요.</div>';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function splitImage() {
            if (!uploadedImage) return;

            const cols = parseInt(document.getElementById('cols').value);
            const rows = parseInt(document.getElementById('rows').value);
            
            const width = uploadedImage.width;
            const height = uploadedImage.height;
            const iconWidth = Math.floor(width / cols);
            const iconHeight = Math.floor(height / rows);

            results.innerHTML = '';
            canvasArray = [];
            status.innerHTML = '<div class="status info">⏳ 이미지를 분리하는 중...</div>';

            const iconNames = [
                '집합장소', '사람', '화살표',
                '비상구1', '소화기', '소화전',
                '계단', '엘리베이터', '비상구2',
                'AED', '여성화장실', '남성화장실'
            ];

            let index = 0;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = iconWidth;
                    canvas.height = iconHeight;
                    const ctx = canvas.getContext('2d');
                    
                    const x = col * iconWidth;
                    const y = row * iconHeight;
                    
                    ctx.drawImage(uploadedImage, x, y, iconWidth, iconHeight, 0, 0, iconWidth, iconHeight);
                    
                    const iconName = iconNames[index] || `아이콘_${index + 1}`;
                    const filename = `icon_${String(index + 1).padStart(2, '0')}_${iconName}.png`;
                    
                    const iconCard = document.createElement('div');
                    iconCard.className = 'icon-card';
                    
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    
                    const title = document.createElement('h4');
                    title.textContent = iconName;
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.textContent = '💾 다운로드';
                    downloadBtn.onclick = () => downloadIcon(canvas, filename);
                    
                    iconCard.appendChild(img);
                    iconCard.appendChild(title);
                    iconCard.appendChild(downloadBtn);
                    results.appendChild(iconCard);
                    
                    canvasArray.push({ canvas, filename });
                    index++;
                }
            }

            status.innerHTML = `<div class="status success">✅ 이미지 분리 완료! ${cols * rows}개의 아이콘이 생성되었습니다.</div>`;
            downloadAllBtn.style.display = 'block';
        }

        function downloadIcon(canvas, filename) {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        function downloadAll() {
            status.innerHTML = '<div class="status info">📦 모든 아이콘을 다운로드하는 중...</div>';
            
            canvasArray.forEach((item, index) => {
                setTimeout(() => {
                    downloadIcon(item.canvas, item.filename);
                    if (index === canvasArray.length - 1) {
                        status.innerHTML = '<div class="status success">✅ 모든 아이콘 다운로드 완료!</div>';
                    }
                }, index * 200); // 각 다운로드 사이에 200ms 간격
            });
        }
    </script>
</body>
</html>
