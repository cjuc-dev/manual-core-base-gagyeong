    <!-- 🚀 [신규] 최상단으로 이동 (Back to Top) 버튼 -->
    <button id="backToTop" onclick="scrollToTop()" 
        class="fixed bottom-8 right-8 w-12 h-12 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md border border-gray-200 dark:border-gray-700 rounded-full shadow-2xl flex items-center justify-center text-emerald-600 dark:text-emerald-400 hover:scale-110 active:scale-95 transition-all opacity-0 invisible z-50 group" 
        aria-label="맨 위로 이동">
        <i class="ph ph-arrow-up text-2xl font-bold group-hover:-translate-y-1 transition-transform" aria-hidden="true"></i>
    </button>

    <!-- 스크립트 로직 -->
    <script>
        // 초기 테마 설정 확인
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleAccordion(menuId, iconId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(iconId);
            const isMenuExpanded = menu.style.maxHeight && menu.style.maxHeight !== '0px';
            if (isMenuExpanded) {
                menu.style.maxHeight = '0px';
                icon.classList.remove('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'false');
            } else {
                menu.style.maxHeight = menu.scrollHeight + 'px';
                icon.classList.add('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'true');
            }
        }

        function toggleTheme() {
            const htmlClasses = document.documentElement.classList;
            if (htmlClasses.contains('dark')) {
                htmlClasses.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlClasses.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        const scrollArea = document.getElementById('mainScrollArea');
        const backToTopBtn = document.getElementById('backToTop');
        if (scrollArea && backToTopBtn) {
            scrollArea.addEventListener('scroll', () => {
                if (scrollArea.scrollTop > 300) {
                    backToTopBtn.classList.remove('opacity-0', 'invisible');
                    backToTopBtn.classList.add('opacity-100', 'visible');
                } else {
                    backToTopBtn.classList.add('opacity-0', 'invisible');
                    backToTopBtn.classList.remove('opacity-100', 'visible');
                }
            });
        }

        function scrollToTop() {
            if (scrollArea) { scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); }
        }

        async function loadContent(contentId, facility = '공통', isPopState = false, searchQuery = null) {
            if(window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
            if (!isPopState) {
                history.pushState({ page: 'content', id: contentId, facility: facility }, '', '?doc=' + encodeURIComponent(contentId) + '&facility=' + encodeURIComponent(facility));
            }
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');
            breadcrumbNav.classList.remove('hidden');
            breadcrumbNav.classList.add('flex');
            const safeId = DOMPurify.sanitize(contentId);
            const titleMap = {
                '행정_매뉴얼': '행정 (Admin)', '기술_매뉴얼': '기술 (Tech)', 'safety': '안전관리 표준매뉴얼',
                'cheongjuSwimming_guide': '청주수영장', 'purmi_guide': '푸르미스포츠센터', 'youngun_sportscenter_guide': '영운국민체육센터',
                'bokdae_sportscenter_guide': '복대국민체육센터', 'gagyeong_sportscenter_guide': '가경국민체육센터',
                'sannam_sportscenter_guide': '산남국민체육센터', 'update': '업데이트 히스토리'
            };
            const docTitle = titleMap[safeId] || safeId;
            const hasTabs = ['행정_매뉴얼', '기술_매뉴얼'].includes(safeId);
            breadcrumbCurrent.textContent = "문서: " + docTitle + (hasTabs ? ' > ' + DOMPurify.sanitize(facility) : '');
            const contentArea = document.getElementById('content-area');
            let tabsHtml = '';
            if (hasTabs) {
                const facilitiesList = ['공통', '청주수영장', '푸르미스포츠센터', '영운국민체육센터', '복대국민체육센터', '가경국민체육센터', '산남국민체육센터'];
                tabsHtml = '<div class="flex flex-wrap gap-2 mb-6" role="tablist">';
                for(let fac of facilitiesList) {
                    const isActive = (fac === facility);
                    const activeClass = isActive ? 'bg-emerald-600 text-white shadow-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300';
                    tabsHtml += `<button onclick="loadContent('${safeId}', '${fac}')" class="px-4 py-2 rounded-lg text-sm transition-all ${activeClass}">${fac}</button>`;
                }
                tabsHtml += '</div>';
            }
            contentArea.innerHTML = tabsHtml + '<div class="py-20 text-center text-gray-400"><i class="ph ph-spinner-gap animate-spin text-4xl mb-4"></i><p>로딩 중...</p></div>';
            if (safeId === 'admin_dashboard') {
                contentArea.innerHTML = `<div class='w-full h-[800px] rounded-2xl overflow-hidden shadow-lg bg-white'><iframe src='pages/admin_dashboard.html' class='w-full h-full border-0'></iframe></div>`;
                return;
            }
            if (safeId === 'safety') {
                contentArea.innerHTML = `<div class="w-full h-[700px] rounded-lg overflow-hidden border border-gray-200"><embed src="docs/체육시설 안전관리 표준매뉴얼.pdf" type="application/pdf" width="100%" height="100%" /></div>`;
                return;
            }
            try {
                const fetchPath = hasTabs ? 'data/' + safeId + '_' + facility + '.md' : 'data/' + safeId + '.md';
                const response = await fetch(fetchPath);
                
                if (!response.ok) {
                    throw new Error(`서버 응답 오류 (${response.status}): ${fetchPath} 파일을 찾을 수 없거나 접근할 수 없습니다.`);
                }
                
                const markdownText = await response.text();
                const rawHtml = marked.parse(markdownText);
                
                const tempTableDiv = document.createElement('div');
                tempTableDiv.innerHTML = rawHtml;
                
                // 표 셀 병합 엔진 (^)
                tempTableDiv.querySelectorAll('table').forEach(table => {
                    const rows = Array.from(table.querySelectorAll('tr'));
                    rows.forEach(row => {
                        let vIdx = 0; Array.from(row.cells).forEach(cell => cell.dataset.vcol = vIdx++);
                    });
                    for (let i = rows.length - 1; i > 0; i--) {
                        Array.from(rows[i].cells).forEach(cell => {
                            const txt = cell.textContent.replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
                            if (txt === '^') {
                                const vcol = cell.dataset.vcol;
                                let tIdx = i - 1; let tCell = null;
                                while (tIdx >= 0) {
                                    const cand = Array.from(rows[tIdx].cells).find(c => c.dataset.vcol === vcol);
                                    if (cand) {
                                        const ctxt = cand.textContent.replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
                                        if (ctxt !== '^') { tCell = cand; break; }
                                    }
                                    tIdx--;
                                }
                                if (tCell) {
                                    const span = parseInt(tCell.getAttribute('rowspan') || 1);
                                    tCell.setAttribute('rowspan', span + 1);
                                    tCell.style.verticalAlign = 'middle';
                                    cell.classList.add('to-be-removed');
                                }
                            }
                        });
                    }
                    table.querySelectorAll('.to-be-removed').forEach(td => td.remove());
                });
                
                let safeHtml = DOMPurify.sanitize(tempTableDiv.innerHTML, { ADD_ATTR: ['rowspan', 'colspan', 'style'] });
                contentArea.innerHTML = tabsHtml + `<div id="markdown-body" class="prose dark:prose-invert max-w-none prose-emerald lg:prose-lg">${safeHtml}</div>`;
            } catch (err) {
                contentArea.innerHTML = tabsHtml + `
                    <div class="text-center py-20 text-gray-500">
                        <i class="ph ph-warning-circle text-5xl mb-4 text-amber-500"></i>
                        <h2 class="text-xl font-bold mb-2 text-gray-800 dark:text-white">문서 로딩 실패</h2>
                        <div class="mt-4 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg text-sm border border-gray-200 dark:border-gray-700 max-w-xl mx-auto">
                            <p class="font-mono text-left break-all text-red-500">${err.message}</p>
                            <p class="mt-2 text-xs text-gray-400 text-left">※ 원인: 서버 미작동, 파일 경로 불일치, 또는 네트워크 연결 오류</p>
                        </div>
                        <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors shadow-lg">페이지 새로고침</button>
                    </div>
                `;
            }
            document.getElementById('mainScrollArea').scrollTop = 0;
        }

        function showDashboard(isPopState = false) {
            document.getElementById('contentView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            if (!isPopState) { history.pushState({ page: 'dashboard' }, '', window.location.pathname); }
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            breadcrumbNav.classList.remove('flex'); breadcrumbNav.classList.add('hidden');
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.page === 'content') { loadContent(e.state.id, e.state.facility || '공통', true); }
            else { showDashboard(true); }
        });

        let searchIndex = [];
        async function initSearchEngine() {
            try {
                const response = await fetch('data/search_index.json');
                if (response.ok) { searchIndex = await response.json(); }
            } catch (e) { console.error('[Search] 인덱스 로드 실패:', e); }
        }
        initSearchEngine();

        function performSearch(query, resultContainerId) {
            const container = document.getElementById(resultContainerId);
            if (!query.trim() || query.length < 2) { container.classList.add('hidden'); return; }
            const safeQuery = DOMPurify.sanitize(query.toLowerCase());
            const results = searchIndex.map(item => {
                let score = 0;
                const title = (item.title || '').toLowerCase();
                const content = (item.content || '').toLowerCase();
                if (title.includes(safeQuery)) score += 50;
                if (title.startsWith(safeQuery)) score += 30;
                const matches = (content.match(new RegExp(safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length;
                score += matches * 2;
                return { ...item, score };
            })
            .filter(item => item.score > 0)
            .sort((a, b) => b.score - a.score).slice(0, 10);
            
            if (results.length > 0) {
                container.innerHTML = results.map(item => {
                    let snippet = item.title;
                    if (item.content) {
                        const idx = item.content.toLowerCase().indexOf(safeQuery);
                        if (idx > -1) {
                            const start = Math.max(0, idx - 25); const end = Math.min(item.content.length, idx + 50);
                            snippet = (start > 0 ? '...' : '') + item.content.substring(start, end).replace(new RegExp(`(${safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<b class="text-emerald-600 dark:text-emerald-400">$1</b>') + (end < item.content.length ? '...' : '');
                        }
                    }
                    return `<button onclick="loadContent('${item.id}', '${item.facility || '공통'}', false, '${safeQuery}'); document.getElementById('${resultContainerId}').classList.add('hidden'); document.getElementById('searchInput').value=''; document.getElementById('searchInputMobile').value='';" class="w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors focus:outline-none"><div class="flex justify-between items-start"><div class="font-bold text-gray-800 dark:text-gray-200 text-sm">${DOMPurify.sanitize(item.title)}</div><span class="text-[10px] px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700 rounded text-gray-400 uppercase">${DOMPurify.sanitize(item.type || 'DOC')}</span></div><div class="text-xs text-gray-500 dark:text-gray-400 mt-1.5 line-clamp-2 leading-relaxed">${DOMPurify.sanitize(snippet, { ALLOWED_TAGS: ['b'], ALLOWED_ATTR: ['class'] })}</div></button>`;
                }).join('');
            } else {
                container.innerHTML = `<div class="px-4 py-8 text-center text-sm text-gray-500">결과가 없습니다.</div>`;
            }
            container.classList.remove('hidden');
        }

        document.getElementById('searchInput')?.addEventListener('input', (e) => performSearch(e.target.value, 'searchResults'));
        document.getElementById('searchInputMobile')?.addEventListener('input', (e) => performSearch(e.target.value, 'searchResultsMobile'));
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchInputMobile')) {
                document.getElementById('searchResults')?.classList.add('hidden');
                document.getElementById('searchResultsMobile')?.classList.add('hidden');
            }
        });
        window.onload = () => {
            const facilityMenu = document.getElementById('facility-menu');
            if(facilityMenu) facilityMenu.style.maxHeight = facilityMenu.scrollHeight + 'px';

            // 🚀 [지능형 초기 라우팅] 주소창의 파라미터(?doc=...&facility=...)를 분석하여 자동 로드
            const params = new URLSearchParams(window.location.search);
            const docId = params.get('doc');
            const facility = params.get('facility') || '공통';

            if (docId) {
                console.log(`[Router] 자동 로드 실행: ${docId} (${facility})`);
                loadContent(docId, facility, true);
            }
        };
    </script>
</body>
</html>
