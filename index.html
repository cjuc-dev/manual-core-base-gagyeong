    <script>
        // 초기 테마 설정 확인
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleAccordion(menuId, iconId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(iconId);
            const isMenuExpanded = menu.style.maxHeight && menu.style.maxHeight !== '0px';

            if (isMenuExpanded) {
                menu.style.maxHeight = '0px';
                icon.classList.remove('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'false');
            } else {
                menu.style.maxHeight = menu.scrollHeight + 'px';
                icon.classList.add('rotate-180');
                menu.previousElementSibling.setAttribute('aria-expanded', 'true');
            }
        }

        function toggleTheme() {
            const htmlClasses = document.documentElement.classList;
            if (htmlClasses.contains('dark')) {
                htmlClasses.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlClasses.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        async function loadContent(contentId, facility = '공통', isPopState = false, searchQuery = null) {
            if(window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }

            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('contentView').classList.remove('hidden');
            
            // History API 연동 (뒤로가기 지원)
            if (!isPopState) {
                history.pushState({ page: 'content', id: contentId, facility: facility }, '', '?doc=' + encodeURIComponent(contentId) + '&facility=' + encodeURIComponent(facility));
            }
            
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');
            breadcrumbNav.classList.remove('hidden');
            breadcrumbNav.classList.add('flex');
            
            // 보안 가이드라인: DOMPurify XSS 검증
            const safeId = DOMPurify.sanitize(contentId);
            
            // 한글 매뉴얼명 매핑
            const titleMap = {
                '행정_매뉴얼': '행정 (Admin)',
                '기술_매뉴얼': '기술 (Tech)',

                    }
                    
                    const markdownText = await response.text();
                    
                    // marked.js 파싱 후 DOMPurify로 XSS 방어 처리 (시큐어 코딩 지침 준수)
                    const rawHtml = marked.parse(markdownText);
                    
                    // 📌 지능형 표 셀 병합 엔진 (사용자 편의성: 일반 MD 표 문법 + ^ 기호 지원)
                    const tempTableDiv = document.createElement('div');
                    tempTableDiv.innerHTML = rawHtml;
                    
                    tempTableDiv.querySelectorAll('table').forEach(table => {
                        const rows = Array.from(table.querySelectorAll('tr'));
                        
                        // 1단계: 각 셀에 실제 '시각적 열 인덱스'를 부여
                        rows.forEach(row => {
                            let visualColIndex = 0;
                            Array.from(row.cells).forEach(cell => {
                                // 이미 이전 행의 rowspan에 의해 점유된 인덱스가 있다면 건너뛰어야 하지만,
                                // 전처리 단계이므로 단순 인덱스로 부여
                                cell.dataset.vcol = visualColIndex++;
                            });
                        });

                        // 2단계: 아래에서 위로 올라가며 병합 처리
                        for (let i = rows.length - 1; i > 0; i--) {
                            const currentCells = Array.from(rows[i].cells);
                            
                            currentCells.forEach(cell => {
                                const cleanText = cell.textContent.replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
                                if (cleanText === '^') {
                                    const vcol = cell.dataset.vcol;
                                    
                                    // 📌 사용자 제안: 실제 데이터가 있는 최상단 셀을 찾을 때까지 위로 탐색
                                    let targetRowIndex = i - 1;
                                    let targetCell = null;
                                    while (targetRowIndex >= 0) {
                                        const candidate = Array.from(rows[targetRowIndex].cells)
                                            .find(c => c.dataset.vcol === vcol);
                                        if (candidate) {
                                            const txt = candidate.textContent
                                                .replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
                                            // '^' 기호가 아닌 실제 데이터가 있는 셀을 발견하면 중단
                                            if (txt !== '^') { 
                                                targetCell = candidate; 
                                                break; 
                                            }
                                        }
                                        targetRowIndex--;
                                    }

                                    if (targetCell) {
                                        const currentSpan = parseInt(targetCell.getAttribute('rowspan') || 1);
                                        targetCell.setAttribute('rowspan', currentSpan + 1);
                                        targetCell.style.verticalAlign = 'middle';
                                        // 📌 강제 정렬 제거: 마크다운 설정(기본 왼쪽)을 따름
                                        cell.classList.add('to-be-removed');
                                    }
                                }
                            });
                        }
                        table.querySelectorAll('.to-be-removed').forEach(td => td.remove());
                    });

                    let safeHtml = DOMPurify.sanitize(tempTableDiv.innerHTML, {
                        ADD_ATTR: ['rowspan', 'colspan', 'style']
                    });
                    
                    // 검색어 하이라이트 (형광펜 효과 고도화)
                    if (searchQuery && searchQuery.trim().length >= 2) {
                        const escapedQuery = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        // 단어의 일부라도 일치하면 마스킹 (gi: 전역 검색, 대소문자 무시)
                        const regex = new RegExp(`(${escapedQuery})`, 'gi');
                        
                        // 시큐어 코딩: HTML 태그(<...>) 외부의 텍스트만 치환하기 위해 임시로 div를 활용한 고도화된 하이라이트 적용
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = safeHtml;
                        
                        const walkNodes = (node) => {
                            if (node.nodeType === 3) { // Text Node
                                const text = node.nodeValue;
                                if (regex.test(text)) {
                                    const span = document.createElement('span');
                                    // 정규식 매칭 부분을 mark 태그로 치환
                                    span.innerHTML = text.replace(regex, '<mark class="search-highlight">$1</mark>');
                                    node.parentNode.replaceChild(span, node);
                                }
                            } else if (node.nodeType === 1 && node.childNodes && !/(script|style|mark)/i.test(node.tagName)) {
                                Array.from(node.childNodes).forEach(walkNodes);
                            }
                        };
                        walkNodes(tempDiv);
                        safeHtml = tempDiv.innerHTML;
                    }

                    // Tailwind Typography (prose) 적용하여 가독성 극대화
                    contentArea.innerHTML = tabsHtml + `
                        <div id="markdown-body" class="prose dark:prose-invert max-w-none prose-emerald lg:prose-lg">
                            ` + safeHtml + `
                        </div>
                    `;

                    // 하이라이트된 위치로 자동 스크롤 (UX 개선)
                    if (searchQuery) {
                        setTimeout(() => {
                            const firstMatch = contentArea.querySelector('mark.search-highlight');
                            if (firstMatch) {
                                firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                // 시각적 피드백: 강조 애니메이션
                                firstMatch.style.outline = '3px solid #eab308';
                                firstMatch.style.outlineOffset = '2px';
                                firstMatch.style.backgroundColor = '#fde047'; // 강제 적용
                                setTimeout(() => {
                                    firstMatch.style.outline = 'none';
                                }, 2000);
                            }
                        }, 200);
                    }
                } catch (error) {
                    contentArea.innerHTML = tabsHtml + `
                        <div class="text-center py-16">
                            <i class="ph ph-warning-circle text-5xl text-amber-500 mb-4" aria-hidden="true"></i>
                            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">문서 준비 중</h2>
                            <p class="text-gray-600 dark:text-gray-400 max-w-lg mx-auto">요청하신 시설의 문서를 불러오지 못했습니다. 관리자가 아직 해당 시설의 매뉴얼 파일을 업로드하지 않았거나 경로에 오류가 있습니다.</p>
                            <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg text-sm text-left text-gray-500 max-w-lg mx-auto overflow-x-auto border border-gray-200 dark:border-gray-700">
                                <code>` + DOMPurify.sanitize(error.message) + `</code>
                            </div>
                        </div>

            }
            
            document.getElementById('mainScrollArea').scrollTop = 0;
        }

        function showDashboard(isPopState = false) {
            document.getElementById('contentView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            
            // History API 연동 (뒤로가기 지원)
            if (!isPopState) {
                history.pushState({ page: 'dashboard' }, '', window.location.pathname);
            }
            
            const breadcrumbNav = document.getElementById('breadcrumbNav');
            breadcrumbNav.classList.remove('flex');
            breadcrumbNav.classList.add('hidden');
        }

        // 브라우저 뒤로가기/앞으로가기 이벤트 처리
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.page === 'content') {
                loadContent(e.state.id, e.state.facility || '공통', true);
            } else {
                showDashboard(true);
            }
        });

        // ----------------------------------------
        // 고도화된 지능형 검색 시스템 (Pre-built Index 기반)
        // ----------------------------------------
        let searchIndex = [];

        async function initSearchEngine() {
            try {
                // 사전 빌드된 통합 인덱스 파일 로드 (성능 극대화)
                const response = await fetch('data/search_index.json');
                if (response.ok) {
                    searchIndex = await response.json();
                    console.log('[Search] 지능형 인덱스 로드 완료 (총 ' + searchIndex.length + '개 항목)');
                }
            } catch (e) {
                console.error('[Search] 인덱스 로드 실패:', e);
            }
        }
        initSearchEngine();

        function performSearch(query, resultContainerId) {
            const container = document.getElementById(resultContainerId);
            if (!query.trim() || query.length < 2) {
                container.classList.add('hidden');
                return;
            }
            
            // 시큐어 코딩: 입력값 Sanitize
            const safeQuery = DOMPurify.sanitize(query.toLowerCase());
            
            // 지능형 가중치 검색 및 정렬
            const results = searchIndex.map(item => {
                let score = 0;
                const title = (item.title || '').toLowerCase();
                const content = (item.content || '').toLowerCase();
                
                // 가중치 1: 제목 일치 (매우 중요)
                if (title.includes(safeQuery)) score += 50;
                if (title.startsWith(safeQuery)) score += 30;
                
                // 가중치 2: 본문 일치
                const contentMatches = (content.match(new RegExp(safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length;
                score += contentMatches * 2;
                
                return { ...item, score };
            })
            .filter(item => item.score > 0)
            .sort((a, b) => b.score - a.score) // 점수 높은 순 정렬
            .slice(0, 10); // 상위 10개만 노출
            
            if (results.length > 0) {
                container.innerHTML = results.map(item => {
                    // 지능형 문맥 스니펫 추출
                    let snippet = item.title;
                    if (item.content) {
                        const idx = item.content.toLowerCase().indexOf(safeQuery);
                        if (idx > -1) {
                            const start = Math.max(0, idx - 25);
                            const end = Math.min(item.content.length, idx + 50);
                            snippet = (start > 0 ? '...' : '') + 
                                      item.content.substring(start, end).replace(new RegExp(`(${safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<b class="text-emerald-600 dark:text-emerald-400">$1</b>') + 
                                      (end < item.content.length ? '...' : '');
                        }
                    }

                    return `
                        <button onclick="loadContent('${item.id}', '${item.facility || '공통'}', false, '${safeQuery}'); document.getElementById('${resultContainerId}').classList.add('hidden'); document.getElementById('searchInput').value=''; document.getElementById('searchInputMobile').value='';" 
                                class="w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors focus:outline-none"
                                aria-label="${item.title} 문서로 이동">
                            <div class="flex justify-between items-start">
                                <div class="font-bold text-gray-800 dark:text-gray-200 text-sm">${DOMPurify.sanitize(item.title)}</div>
                                <span class="text-[10px] px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700 rounded text-gray-400 uppercase">${DOMPurify.sanitize(item.type || 'DOC')}</span>
                            </div>
                            <div class="text-xs text-gray-500 dark:text-gray-400 mt-1.5 line-clamp-2 leading-relaxed">${DOMPurify.sanitize(snippet, { ALLOWED_TAGS: ['b'], ALLOWED_ATTR: ['class'] })}</div>
                        </button>
                    `;
                }).join('');
            } else {
                container.innerHTML = `
                    <div class="px-4 py-8 text-center">
                        <i class="ph ph-magnifying-glass text-3xl text-gray-300 dark:text-gray-600 mb-2"></i>
                        <div class="text-sm text-gray-500">
                            "<span class="font-semibold text-gray-700 dark:text-gray-300">${safeQuery}</span>" 에 대한 결과가 없습니다.
                        </div>
                        <p class="text-[11px] text-gray-400 mt-1">단어의 철자나 띄어쓰기를 확인해 보세요.</p>
                    </div>
                `;
            }
            container.classList.remove('hidden');
        }

        // 검색 이벤트 바인딩
        document.getElementById('searchInput')?.addEventListener('input', (e) => performSearch(e.target.value, 'searchResults'));
        document.getElementById('searchInputMobile')?.addEventListener('input', (e) => performSearch(e.target.value, 'searchResultsMobile'));

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchInputMobile')) {
                document.getElementById('searchResults')?.classList.add('hidden');
                document.getElementById('searchResultsMobile')?.classList.add('hidden');
            }
        });

        window.onload = () => {
            const facilityMenu = document.getElementById('facility-menu');
            if(facilityMenu) facilityMenu.style.maxHeight = facilityMenu.scrollHeight + 'px';
        };
    </script>
</body>
</html>
